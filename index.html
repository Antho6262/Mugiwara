<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Mugiwara — Connexion</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-card">
    <img src="img/logo.png" alt="Les Mugiwara" class="login-logo">
    <h1>MUGIWARA</h1>
    <div class="login-sub">L'ÉQUIPAGE</div>
    <form id="form-login">
      <div class="field">
        <label>Pseudo</label>
        <input type="text" id="l-pseudo" placeholder="Ton pseudo" required autocomplete="username">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="l-pass" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button class="submit" type="submit" style="margin-top:6px;">Embarquer</button>
    </form>
    <div class="login-error" id="l-error"></div>
    <div class="login-links">Première utilisation ? <a href="setup.html">Initialiser le site</a></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
  // déjà connecté -> direct au dashboard
  if (getSession()) window.location.href = 'pages/dashboard.html';

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pseudo = document.getElementById('l-pseudo').value.trim();
    const pass = document.getElementById('l-pass').value;
    const errEl = document.getElementById('l-error');
    errEl.textContent = '';

    try {
      const snap = await db.ref('membres').get();
      const membres = entries(snap.val());
      const found = membres.find(([id, m]) =>
        m.prenom && m.prenom.toLowerCase() === pseudo.toLowerCase() && m.mot_de_passe === pass
      );
      if (!found) {
        errEl.textContent = 'Pseudo ou mot de passe incorrect.';
        return;
      }
      const [id, m] = found;
      if (m.actif === false) {
        errEl.textContent = 'Ce compte est désactivé.';
        return;
      }
      setSession({ id, prenom: m.prenom, grade: m.grade, role: m.role || 'membre' });
      window.location.href = 'pages/dashboard.html';
    } catch (err) {
      errEl.textContent = "Impossible de contacter le site — vérifie ta config Firebase.";
      console.error(err);
    }
  });
</script>
</body>
</html>
