name: Vérification semaine The Roolio Family

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check-semaine:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer firebase-admin
        run: npm install firebase-admin @firebase/app

      - name: Vérifier / créer la semaine active
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: "https://klan-nostrad-default-rtdb.europe-west1.firebasedatabase.app"
        run: node .github/scripts/check-semaine.js
