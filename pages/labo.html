<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labo — The Roolio Family</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="shell"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
let SESSION, ACTIVE_WEEK = null, MEMBRES = {}, LABO_ACTION_ID = null, LABO_PRODUITS = {}, LABO_STOCK = {}, LABO_STOCK_COMMUN = {}, GRADES_MASQUES = new Set();
let ALL_SEMAINES = [], ACTIVE_WEEK_ID = null, ACTIONS_REF = null;

let RAW = { membres: {}, stockLabo: {}, laboStock: {}, laboCommun: {}, visi: {}, actions: {} };

function renderTout() {
  MEMBRES = RAW.membres;
  LABO_PRODUITS = (RAW.stockLabo || {}).produits || {};
  LABO_STOCK = RAW.laboStock;
  LABO_STOCK_COMMUN = RAW.laboCommun;
  const visi = RAW.visi;
  const gradesMasques = new Set(Object.keys(visi).filter(g => visi[g] && visi[g].labo === false));
  GRADES_MASQUES = gradesMasques;

  const wrapFM = document.getElementById("wrapFMembre"), filtM = document.getElementById("filtMembre");
  const prevFM = document.getElementById("fMembre") ? document.getElementById("fMembre").value : null;
  const prevFiltM = filtM.value;
  filtM.innerHTML = '<option value="">Tous les membres</option>';
  if (SESSION.role === "admin") {
    wrapFM.innerHTML = `<label class="l">Membre</label><select id="fMembre"></select>`;
    const selM = document.getElementById("fMembre");
    entries(MEMBRES).forEach(([id, m]) => {
      if (m.actif === false || gradesMasques.has(m.grade)) return;
      const label = m.prenom + (m.nom ? " " + m.nom : "");
      selM.appendChild(new Option(label, id, id === SESSION.id, id === (prevFM || SESSION.id)));
    });
  } else {
    wrapFM.innerHTML = `<label class="l">Membre</label><input type="text" value="${SESSION.prenom}" disabled>`;
  }
  entries(MEMBRES).forEach(([id, m]) => {
    if (m.actif === false || gradesMasques.has(m.grade)) return;
    const label = m.prenom + (m.nom ? " " + m.nom : "");
    filtM.appendChild(new Option(label, id));
  });
  if (prevFiltM) filtM.value = prevFiltM;

  renderLaboTabs();
  renderHistoriqueDepuisActions();
}

function renderHistoriqueDepuisActions() {
  if (!ACTIVE_WEEK) { HISTORIQUE = []; renderHistorique(); return; }
  const all = entries(RAW.actions).map(([id, a]) => ({ id, ...a }));
  HISTORIQUE = all.filter(a => a.action_id === LABO_ACTION_ID).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  renderHistorique();
}

function majSemaines(snap) {
  ALL_SEMAINES = entries(snap.val()).map(([id, s]) => ({ id, ...s })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  ACTIVE_WEEK = ALL_SEMAINES.find(s => s.bloquee !== true) || ALL_SEMAINES[0] || null;
  const lbl = document.getElementById("weekLabel");
  if (lbl) lbl.textContent = "Semaine active : " + (ACTIVE_WEEK ? ACTIVE_WEEK.nom : "—");

  const newWeekId = ACTIVE_WEEK ? ACTIVE_WEEK.id : null;
  if (newWeekId !== ACTIVE_WEEK_ID) {
    if (ACTIONS_REF) ACTIONS_REF.off("value");
    ACTIVE_WEEK_ID = newWeekId;
    RAW.actions = {};
    if (ACTIVE_WEEK_ID) {
      ACTIONS_REF = db.ref("actions/" + ACTIVE_WEEK_ID);
      ACTIONS_REF.on("value", snap2 => { RAW.actions = snap2.val() || {}; renderHistoriqueDepuisActions(); });
    } else {
      ACTIONS_REF = null;
      renderHistoriqueDepuisActions();
    }
  } else {
    renderHistoriqueDepuisActions();
  }
}

// Crée la catégorie de stock "Labo" et l'action "Labo" si elles n'existent pas encore
async function bootstrap() {
  const snapStock = await db.ref("stock/labo_cat").once("value");
  if (!snapStock.val()) await db.ref("stock/labo_cat").set({ nom: "Labo", emoji: "🧪", produits: {} });

  const snapActions = await db.ref("actions_dispo").once("value");
  const actions = snapActions.val() || {};
  const found = Object.entries(actions).find(([, a]) => a.nom === "Labo");
  if (found) {
    LABO_ACTION_ID = found[0];
    if (found[1].cat_variable !== "labo_cat") {
      await db.ref("actions_dispo/" + found[0] + "/cat_variable").set("labo_cat");
    }
  } else {
    LABO_ACTION_ID = "labo";
    await db.ref("actions_dispo/labo").set({ nom: "Labo", montant_sale: 0, montant_propre: 0, recipe: [], cat_variable: "labo_cat" });
  }
}

function renderContent() {
  document.getElementById("content").innerHTML = `
    <h1>Labo</h1>
    <div class="sigil-rule"></div>
    <p class="muted small" id="weekLabel">Semaine active : —</p>

    <div class="tabs mt16" id="laboTabsBar"></div>

    <div class="panel mt16">
      <div class="panel-head"><h2>Stock d'ingrédients (commun)</h2></div>
      <p class="small muted">Stock commun à toute la faction — ajoute ce que tu as récolté (ex: champignons), ça met à jour le stock pour tout le monde. Pour créer un nouvel ingrédient ou une nouvelle drogue (recette), voir Admin → Stock → catégorie Labo.</p>
      <div id="zoneIngredients">Chargement…</div>
    </div>

    <div class="panel mt16">
      <div class="panel-head"><h2>Nouvelle production — <span id="produitActifNom">—</span></h2></div>
      <div class="row">
        <div id="wrapFMembre"><label class="l">Membre</label><select id="fMembre"></select></div>
        <div><label class="l">Quantité</label><input type="number" id="fQte" value="1" min="1"></div>
        <div><label class="l">Résultat</label><select id="fResultat" onchange="toggleRaison()"><option>Réussite</option><option>Échec</option></select></div>
      </div>
      <div class="row mt8">
        <div id="raisonWrap" style="display:none;"><label class="l">Raison de l'échec</label><input type="text" id="fRaison" placeholder="Optionnel"></div>
        <div><label class="l">Date</label><input type="date" id="fDate"></div>
        <div style="display:flex;align-items:flex-end;"><button class="btn btn-primary" style="width:100%;" onclick="ajouterProduction()">Enregistrer</button></div>
      </div>
      <p class="small muted mt8">Une production réussie retire automatiquement les ingrédients de la recette du stock commun, et ajoute la quantité produite au stock commun de la faction.</p>
    </div>

    <h2 class="mt24">Stock Labo — commun</h2>
    <div id="zoneStock">Chargement…</div>

    <div class="panel">
      <div class="panel-head">
        <h2>Historique — ${ACTIVE_WEEK ? ACTIVE_WEEK.nom : ""}</h2>
        <div class="row" style="max-width:420px;">
          <select id="filtMembre" onchange="renderHistorique()"><option value="">Tous les membres</option></select>
          <select id="filtResultat" onchange="renderHistorique()"><option value="">Tous résultats</option><option>Réussite</option><option>Échec</option></select>
          <select id="filtLimite" onchange="renderHistorique()"><option value="10">Afficher 10</option><option value="30">Afficher 30</option><option value="9999">Tout afficher</option></select>
        </div>
      </div>
      <table>
        <thead><tr><th>Date</th><th>Membre</th><th>Produit</th><th>Qté</th><th>Résultat</th><th></th></tr></thead>
        <tbody id="tblHistorique"><tr class="empty-row"><td colspan="6">Chargement…</td></tr></tbody>
      </table>
    </div>
  `;
  document.getElementById("fDate").value = todayISO();
}

function toggleRaison() {
  document.getElementById("raisonWrap").style.display = document.getElementById("fResultat").value === "Échec" ? "block" : "none";
}

async function ajouterIngredient(pid) {
  const input = document.getElementById("qteIng_" + pid);
  const qte = Number(input.value) || 0;
  if (qte <= 0) { toast("Quantité invalide.", true); return; }
  const ref = db.ref(`labo_stock_commun/${pid}`);
  const snap = await ref.once("value");
  const current = Number(snap.val()) || 0;
  await ref.set(current + qte);
  input.value = 1;
  toast("Ajouté au stock commun.");
}

function afficherZoneIngredients() {
  const zone = document.getElementById("zoneIngredients");
  const prod = LABO_PRODUITS[ACTIVE_LABO_TAB];
  const idsRecette = prod && prod.recipe ? new Set(prod.recipe.map(l => l.ingredientId)) : null;
  const ingredients = Object.entries(LABO_PRODUITS).filter(([pid, p]) =>
    !(p.recipe && p.recipe.length) && (!idsRecette || idsRecette.has(pid))
  );
  zone.innerHTML = ingredients.length ? ingredients.map(([pid, p]) => `
    <div class="row mt8" style="align-items:center;">
      <div style="min-width:160px;">${p.nom} — <strong>${Number(LABO_STOCK_COMMUN[pid]) || 0}</strong> en stock</div>
      <input type="number" id="qteIng_${pid}" value="1" min="1" style="max-width:90px;">
      <button class="btn btn-gold" onclick="ajouterIngredient('${pid}')">Ajouter au stock commun</button>
    </div>
  `).join("") : '<p class="muted small">Aucun ingrédient dans la recette de ce produit — vas dans Admin → Stock → catégorie Labo pour en créer.</p>';
}

async function ajouterProduction() {
  if (!ACTIVE_WEEK) { toast("Aucune semaine active.", true); return; }
  if (ACTIVE_WEEK.bloquee) { toast("La semaine active est bloquée.", true); return; }
  const membreId = SESSION.role === "admin" ? document.getElementById("fMembre").value : SESSION.id;
  const pid = ACTIVE_LABO_TAB;
  const qte = Number(document.getElementById("fQte").value) || 0;
  const resultat = document.getElementById("fResultat").value;
  const raison = document.getElementById("fRaison").value;
  const m = MEMBRES[membreId], prod = LABO_PRODUITS[pid];
  if (!m || !prod || qte <= 0) { toast("Complétez le formulaire.", true); return; }

  const entry = {
    membre_id: membreId, prenom_membre: m.prenom, nom_membre: m.nom || "", grade_membre: m.grade || "",
    action: "Labo", action_id: LABO_ACTION_ID, quantite: qte,
    date: document.getElementById("fDate").value || todayISO(), heure: nowHHMM(),
    resultat, raison_echec: resultat === "Échec" ? raison : "",
    argent_sale: 0, argent_propre: 0, gains_totaux: 0,
    produit_drogue: prod.nom, produit_drogue_id: pid,
    createdAt: Date.now()
  };
  await db.ref("actions/" + ACTIVE_WEEK.id + "/" + uid()).set(entry);

  if (resultat === "Réussite") {
    const recipe = prod.recipe || [];
    for (const ligne of recipe) {
      const refIng = db.ref(`labo_stock_commun/${ligne.ingredientId}`);
      const snapIng = await refIng.once("value");
      const currentIng = Number(snapIng.val()) || 0;
      await refIng.set(Math.max(0, currentIng - ligne.qty * qte));
    }

    // Si ce produit fini est lié à un produit vendable (ex: Vente de Drogue), on crédite CE stock-là
    // uniquement (un seul chiffre partagé, plus de double compteur qui finit par diverger).
    // Sans lien configuré, on garde l'ancien comportement (stock Labo interne).
    if (prod.venteCatId && prod.venteProdId) {
      const refVente = db.ref(`stock/${prod.venteCatId}/produits/${prod.venteProdId}/stock`);
      const snapVente = await refVente.once("value");
      const currentVente = Number(snapVente.val()) || 0;
      await refVente.set(currentVente + qte);
      await db.ref(`stock/labo_cat/produits/${pid}/stock`).set(currentVente + qte);
    } else {
      const refCommun = db.ref(`stock/labo_cat/produits/${pid}/stock`);
      const snapCommun = await refCommun.once("value");
      const currentCommun = Number(snapCommun.val()) || 0;
      await refCommun.set(currentCommun + qte);
    }
  }

  toast("Production enregistrée.");
  document.getElementById("fQte").value = 1;
  document.getElementById("fResultat").value = "Réussite";
  toggleRaison();
}

function badgeNiveau(p) {
  const stock = Number(p.stock) || 0, seuil = Number(p.seuil) || 0;
  if (stock <= seuil) return '<span class="badge badge-fail">Rupture</span>';
  if (stock <= seuil * 1.5) return '<span class="badge badge-warn">Faible</span>';
  return '<span class="badge badge-ok">OK</span>';
}

let ACTIVE_LABO_TAB = null;

function emojiProduit(nom) {
  const n = (nom || "").toLowerCase();
  if (n.includes("spor") || n.includes("champi") || n.includes("psilo")) return "🍄";
  if (n.includes("héro") || n.includes("hero")) return "💉";
  if (n.includes("meth")) return "🧪";
  if (n.includes("cannabis") || n.includes("weed")) return "🌿";
  if (n.includes("cocaïne") || n.includes("coke") || n.includes("cock")) return "❄️";
  if (n.includes("ecstasy") || n.includes("mdma")) return "💊";
  if (n.includes("lean")) return "🧃";
  return "💊";
}

function switchLaboTab(pid) {
  ACTIVE_LABO_TAB = pid;
  renderLaboTabs();
}

function renderLaboTabs() {
  const tabsBar = document.getElementById("laboTabsBar");
  const produitsIds = Object.entries(LABO_PRODUITS).filter(([, p]) => p.recipe && p.recipe.length).map(([pid]) => pid);

  if (!produitsIds.length) {
    tabsBar.innerHTML = "";
    document.getElementById("produitActifNom").textContent = "—";
    document.getElementById("zoneStock").innerHTML = '<p class="muted small">Aucun produit fini Labo configuré — vas dans Admin → Stock → catégorie Labo.</p>';
    return;
  }
  if (!ACTIVE_LABO_TAB || !produitsIds.includes(ACTIVE_LABO_TAB)) ACTIVE_LABO_TAB = produitsIds[0];

  tabsBar.innerHTML = produitsIds.map(pid =>
    `<div class="tab ${ACTIVE_LABO_TAB === pid ? "active" : ""}" onclick="switchLaboTab('${pid}')">${emojiProduit(LABO_PRODUITS[pid].nom)} ${LABO_PRODUITS[pid].nom}</div>`
  ).join("");

  document.getElementById("produitActifNom").textContent = LABO_PRODUITS[ACTIVE_LABO_TAB].nom;
  afficherZoneIngredients();
  afficherStock();
}

async function afficherStock() {
  const zone = document.getElementById("zoneStock");
  if (!ACTIVE_LABO_TAB) return;

  const pid = ACTIVE_LABO_TAB;
  const p = LABO_PRODUITS[pid];
  if (!p) return;
  const stockAll = RAW.stockAll || {};
  let stockAffiche = Number(p.stock) || 0;
  if (p.venteCatId && p.venteProdId) {
    const catVente = stockAll[p.venteCatId];
    const prodVente = catVente && catVente.produits ? catVente.produits[p.venteProdId] : null;
    // Lecture en direct du stock vendable lié : reste toujours identique, même après une vente.
    stockAffiche = prodVente ? (Number(prodVente.stock) || 0) : stockAffiche;
  }
  const pAff = { ...p, stock: stockAffiche };
  zone.innerHTML = `<div class="panel">
    <table><thead><tr><th>Produit</th><th>Prix</th><th>Stock</th><th>Seuil</th><th>Niveau</th></tr></thead><tbody>
      <tr><td>${p.nom}</td><td>${formatMoney(p.prix)}</td><td class="mono">${stockAffiche}</td><td class="mono">${p.seuil || 0}</td><td>${badgeNiveau(pAff)}</td></tr>
    </tbody></table>
  </div>`;
}

async function supprimerProduction(semaineId, id, membreId, pid, qte, resultat) {
  if (!confirm("Supprimer cette production ? Les ingrédients consommés seront restitués au stock commun.")) return;
  if (resultat === "Réussite") {
    const prod = LABO_PRODUITS[pid] || {};
    if (prod.venteCatId && prod.venteProdId) {
      const refVente = db.ref(`stock/${prod.venteCatId}/produits/${prod.venteProdId}/stock`);
      const snapVente = await refVente.once("value");
      const currentVente = Number(snapVente.val()) || 0;
      const nouveauVente = Math.max(0, currentVente - qte);
      await refVente.set(nouveauVente);
      await db.ref(`stock/labo_cat/produits/${pid}/stock`).set(nouveauVente);
    } else {
      const refCommun = db.ref(`stock/labo_cat/produits/${pid}/stock`);
      const snapCommun = await refCommun.once("value");
      const currentCommun = Number(snapCommun.val()) || 0;
      await refCommun.set(Math.max(0, currentCommun - qte));
    }

    const recipe = prod.recipe || [];
    for (const ligne of recipe) {
      const refIng = db.ref(`labo_stock_commun/${ligne.ingredientId}`);
      const snapIng = await refIng.once("value");
      const currentIng = Number(snapIng.val()) || 0;
      await refIng.set(currentIng + ligne.qty * qte);
    }
  }
  await db.ref("actions/" + semaineId + "/" + id).remove();
  toast("Production supprimée.");
}

function renderHistorique() {
  const fm = document.getElementById("filtMembre").value;
  const fr = document.getElementById("filtResultat").value;
  const limite = Number(document.getElementById("filtLimite").value) || 10;
  const rows = (HISTORIQUE || []).filter(a => (!fm || a.membre_id === fm) && (!fr || a.resultat === fr)).slice(0, limite);
  document.getElementById("tblHistorique").innerHTML = rows.length ? rows.map(a => `
    <tr>
      <td>${a.date} ${a.heure || ""}</td>
      <td>${a.prenom_membre}</td>
      <td>${a.produit_drogue || ""}</td>
      <td>${a.quantite}</td>
      <td><span class="badge ${a.resultat === "Réussite" ? "badge-ok" : "badge-fail"}">${a.resultat}</span></td>
      <td>${SESSION.role === "admin" ? `<span class="btn btn-sm btn-danger" onclick="supprimerProduction('${ACTIVE_WEEK.id}','${a.id}','${a.membre_id}','${a.produit_drogue_id}',${a.quantite},'${a.resultat}')">Suppr.</span>` : ""}</td>
    </tr>`).join("") : '<tr class="empty-row"><td colspan="6">Aucune production</td></tr>';
}

let HISTORIQUE = [];

(async function () {
  await authReady;
  SESSION = await initShell("labo", "Labo");
  if (!SESSION) return;
  await bootstrap();
  renderContent();

  db.ref("semaines").on("value", majSemaines);
  db.ref("membres").on("value", snap => { RAW.membres = snap.val() || {}; renderTout(); });
  db.ref("stock/labo_cat").on("value", snap => { RAW.stockLabo = snap.val() || {}; renderTout(); });
  db.ref("stock").on("value", snap => { RAW.stockAll = snap.val() || {}; renderTout(); });
  db.ref("labo_stock").on("value", snap => { RAW.laboStock = snap.val() || {}; renderTout(); });
  db.ref("labo_stock_commun").on("value", snap => { RAW.laboCommun = snap.val() || {}; renderTout(); });
  db.ref("visibilite_grades").on("value", snap => { RAW.visi = snap.val() || {}; renderTout(); });
})();
</script>
</body>
</html>
