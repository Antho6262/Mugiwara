<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Mugiwara — Tracker</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="pagehead">
      <h2 id="pagehead-title">Tracker</h2>
      <div class="rule"></div>
    </div>

    <div class="tabs">
      <button data-tab="actions" class="active">🏴‍☠️ Action</button>
      <button data-tab="gofast">🏠 Cambriolage</button>
      <button data-tab="vente">💊 Vente</button>
      <button data-tab="labo">🧪 Labo</button>
    </div>

    <!-- ACTIONS -->
    <div class="tabpanel active" id="panel-actions">
      <div class="card">
        <h3>Nouvelle action</h3>
        <form class="entry" id="form-actions">
          <div class="field"><label>Membre</label><select id="a-member" required></select></div>
          <div class="field"><label>Montant total ($)</label><input type="number" id="a-montant" min="0" step="1" required></div>
          <div class="field"><label>Note</label><input type="text" id="a-note" placeholder="optionnel"></div>
          <button class="submit" type="submit">Ajouter</button>
        </form>
        <div class="note-hint" id="a-rate-hint"></div>
      </div>
      <div class="card">
        <h3>Historique</h3>
        <table><thead><tr><th>Membre</th><th>Montant</th><th>Part</th><th>Note</th><th></th></tr></thead><tbody id="a-table"></tbody></table>
        <div class="totals" id="a-totals"></div>
        <div class="grand" id="a-grand"></div>
      </div>
    </div>

    <!-- GO FAST -->
    <div class="tabpanel" id="panel-gofast">
      <div class="card">
        <h3>Nouveau cambriolage</h3>
        <form class="entry" id="form-gofast">
          <div class="field"><label>Membre</label><select id="g-member" required></select></div>
          <div class="field"><label>Nombre de cambriolages</label><input type="number" id="g-count" min="1" step="1" value="1" required></div>
          <div class="field"><label>Note</label><input type="text" id="g-note" placeholder="optionnel"></div>
          <button class="submit" type="submit">Ajouter</button>
        </form>
        <div class="note-hint" id="g-rate-hint"></div>
      </div>
      <div class="card">
        <h3>Historique</h3>
        <table><thead><tr><th>Membre</th><th>Cambriolage</th><th>Gain</th><th>Note</th><th></th></tr></thead><tbody id="g-table"></tbody></table>
        <div class="totals" id="g-totals"></div>
        <div class="grand" id="g-grand"></div>
      </div>
    </div>

    <!-- VENTE -->
    <div class="tabpanel" id="panel-vente">
      <div class="card">
        <h3>Nouvelle vente</h3>
        <form class="entry" id="form-vente">
          <div class="field"><label>Membre</label><select id="v-member" required></select></div>
          <div class="field"><label>Pochons vendus 💊</label><input type="number" id="v-qty" min="1" step="1" value="1" required></div>
          <div class="field"><label>Note</label><input type="text" id="v-note" placeholder="optionnel"></div>
          <button class="submit" type="submit">Ajouter</button>
        </form>
        <div class="note-hint" id="v-rate-hint"></div>
      </div>
      <div class="card">
        <h3>Historique</h3>
        <table><thead><tr><th>Membre</th><th>Pochons</th><th>Gain</th><th>Note</th><th></th></tr></thead><tbody id="v-table"></tbody></table>
        <div class="totals" id="v-totals"></div>
        <div class="grand" id="v-grand"></div>
      </div>
    </div>

    <!-- LABO -->
    <div class="tabpanel" id="panel-labo">
      <div class="card">
        <h3>Nouvelle récolte</h3>
        <form class="entry" id="form-labo">
          <div class="field"><label>Membre</label><select id="l-member" required></select></div>
          <div class="field"><label>Fertilisant utilisé</label><input type="number" id="l-fertilisant" min="0" step="1" value="0"></div>
          <div class="field"><label>Eau utilisée</label><input type="number" id="l-eau" min="0" step="1" value="0"></div>
          <div class="field"><label>Graines de strawberry</label><input type="number" id="l-graines" min="0" step="1" value="0"></div>
          <div class="field"><label>Pots utilisés</label><input type="number" id="l-pots" min="0" step="1" value="0"></div>
          <div class="field"><label>Nom de la branche récoltée</label><input type="text" id="l-branche" placeholder="Ex: Branche #12" required></div>
          <div class="field"><label>Note</label><input type="text" id="l-note" placeholder="optionnel"></div>
          <button class="submit" type="submit">Enregistrer la récolte</button>
        </form>
        <div class="note-hint" id="l-rate-hint"></div>
      </div>
      <div class="card">
        <h3>Historique</h3>
        <table>
          <thead><tr><th>Membre</th><th>Branche</th><th>Fertilisant</th><th>Eau</th><th>Graines</th><th>Pots</th><th>Gain</th><th></th></tr></thead>
          <tbody id="l-table"></tbody>
        </table>
        <div class="totals" id="l-totals"></div>
        <div class="grand" id="l-grand"></div>
      </div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
  const membre = initShell('tracker', 'Tracker');
  if (membre) {
    let membres = {};
    let config = { taux_action_pct: 25, taux_cambriolage: 700, taux_pochon: 25 };
    let activeWeekId = null;
    db.ref('config/semaine_active_id').on('value', s => { activeWeekId = s.val(); });

    document.querySelectorAll('.tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tabpanel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });

    function fillMemberSelects() {
      const opts = Object.entries(membres)
        .filter(([id, m]) => m.actif !== false)
        .map(([id, m]) => `<option value="${id}">${gradeInfo(m.grade).emoji} ${m.prenom}</option>`)
        .join('') || '<option value="">Aucun membre — ajoute-le dans Admin</option>';
      ['a-member', 'g-member', 'v-member', 'l-member'].forEach(sid => {
        const sel = document.getElementById(sid);
        const cur = sel.value;
        sel.innerHTML = opts;
        if (cur) sel.value = cur;
      });
    }

    function renderHints() {
      document.getElementById('a-rate-hint').textContent = `Taux actuel : ${config.taux_action_pct}% du montant (épicerie, ATM, go fast) reversé au membre.`;
      document.getElementById('g-rate-hint').textContent = `Taux actuel : ${fmtMoney(config.taux_cambriolage)} par cambriolage.`;
      document.getElementById('v-rate-hint').textContent = `Taux actuel : ${fmtMoney(config.taux_pochon)} par pochon vendu.`;
      document.getElementById('l-rate-hint').textContent = `Taux actuel : ${fmtMoney(config.taux_branche)} par branche récoltée. Les quantités saisies sont retirées automatiquement du stock (catégorie Labo) si les produits existent.`;
    }

    function renderTotalsChips(elId, totals) {
      const el = document.getElementById(elId);
      const es = Object.entries(totals);
      el.innerHTML = es.length === 0 ? '' : es.map(([id, sum]) => {
        const m = membres[id];
        const g = m ? gradeInfo(m.grade) : null;
        return `<div class="total-chip">${g ? g.emoji : '❓'} ${m ? m.prenom : '?'} — <b>${fmtMoney(sum)}</b></div>`;
      }).join('');
    }

    // ---- ACTIONS ----
    db.ref('actions').on('value', snap => {
      const rows = entries(snap.val());
      const tbody = document.getElementById('a-table');
      const totals = {}; let grand = 0;
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty">Aucune action enregistrée.</td></tr>`;
      } else {
        tbody.innerHTML = rows.slice().reverse().map(([id, a]) => {
          const m = membres[a.membre_id];
          const gain = (a.montant || 0) * (config.taux_action_pct / 100);
          totals[a.membre_id] = (totals[a.membre_id] || 0) + gain;
          grand += gain;
          const g = m ? gradeInfo(m.grade) : null;
          return `<tr>
            <td>${g ? g.emoji : '❓'} ${m ? m.prenom : 'Membre supprimé'}</td>
            <td>${fmtMoney(a.montant)}</td>
            <td class="amt">${fmtMoney(gain)}</td>
            <td>${a.note || '—'}</td>
            <td><button class="del" data-id="${id}" data-type="actions">✕</button></td>
          </tr>`;
        }).join('');
      }
      renderTotalsChips('a-totals', totals);
      document.getElementById('a-grand').textContent = 'Total équipe : ' + fmtMoney(grand);
    });

    document.getElementById('form-actions').addEventListener('submit', e => {
      e.preventDefault();
      const membre_id = document.getElementById('a-member').value;
      const montant = parseFloat(document.getElementById('a-montant').value);
      const note = document.getElementById('a-note').value.trim();
      if (!membre_id || isNaN(montant)) return;
      db.ref('actions/' + uid()).set({ membre_id, montant, note, date: new Date().toISOString(), par: membre.id, semaine_id: activeWeekId });
      document.getElementById('a-montant').value = '';
      document.getElementById('a-note').value = '';
    });

    // ---- GO FAST ----
    db.ref('cambriolages').on('value', snap => {
      const rows = entries(snap.val());
      const tbody = document.getElementById('g-table');
      const totals = {}; let grand = 0;
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty">Aucun cambriolage enregistré.</td></tr>`;
      } else {
        tbody.innerHTML = rows.slice().reverse().map(([id, gf]) => {
          const m = membres[gf.membre_id];
          const gain = (gf.count || 0) * config.taux_cambriolage;
          totals[gf.membre_id] = (totals[gf.membre_id] || 0) + gain;
          grand += gain;
          const g = m ? gradeInfo(m.grade) : null;
          return `<tr>
            <td>${g ? g.emoji : '❓'} ${m ? m.prenom : 'Membre supprimé'}</td>
            <td>🏠 ${gf.count}</td>
            <td class="amt">${fmtMoney(gain)}</td>
            <td>${gf.note || '—'}</td>
            <td><button class="del" data-id="${id}" data-type="cambriolages">✕</button></td>
          </tr>`;
        }).join('');
      }
      renderTotalsChips('g-totals', totals);
      document.getElementById('g-grand').textContent = 'Total équipe : ' + fmtMoney(grand);
    });

    document.getElementById('form-gofast').addEventListener('submit', e => {
      e.preventDefault();
      const membre_id = document.getElementById('g-member').value;
      const count = parseInt(document.getElementById('g-count').value, 10);
      const note = document.getElementById('g-note').value.trim();
      if (!membre_id || isNaN(count) || count < 1) return;
      db.ref('cambriolages/' + uid()).set({ membre_id, count, note, date: new Date().toISOString(), par: membre.id, semaine_id: activeWeekId });
      document.getElementById('g-count').value = '1';
      document.getElementById('g-note').value = '';
    });

    // ---- VENTE ----
    db.ref('ventes').on('value', snap => {
      const rows = entries(snap.val());
      const tbody = document.getElementById('v-table');
      const totals = {}; let grand = 0;
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty">Aucune vente enregistrée.</td></tr>`;
      } else {
        tbody.innerHTML = rows.slice().reverse().map(([id, v]) => {
          const m = membres[v.membre_id];
          const gain = (v.qty || 0) * config.taux_pochon;
          totals[v.membre_id] = (totals[v.membre_id] || 0) + gain;
          grand += gain;
          const g = m ? gradeInfo(m.grade) : null;
          return `<tr>
            <td>${g ? g.emoji : '❓'} ${m ? m.prenom : 'Membre supprimé'}</td>
            <td>💊 ${v.qty}</td>
            <td class="amt">${fmtMoney(gain)}</td>
            <td>${v.note || '—'}</td>
            <td><button class="del" data-id="${id}" data-type="ventes">✕</button></td>
          </tr>`;
        }).join('');
      }
      renderTotalsChips('v-totals', totals);
      document.getElementById('v-grand').textContent = 'Total équipe : ' + fmtMoney(grand);
    });

    document.getElementById('form-vente').addEventListener('submit', e => {
      e.preventDefault();
      const membre_id = document.getElementById('v-member').value;
      const qty = parseInt(document.getElementById('v-qty').value, 10);
      const note = document.getElementById('v-note').value.trim();
      if (!membre_id || isNaN(qty) || qty < 1) return;
      db.ref('ventes/' + uid()).set({ membre_id, qty, note, date: new Date().toISOString(), par: membre.id, semaine_id: activeWeekId });
      document.getElementById('v-qty').value = '1';
      document.getElementById('v-note').value = '';
    });

    // ---- LABO ----
    db.ref('labos').on('value', snap => {
      const rows = entries(snap.val());
      const tbody = document.getElementById('l-table');
      const totals = {}; let grand = 0;
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty">Aucune récolte enregistrée.</td></tr>`;
      } else {
        tbody.innerHTML = rows.slice().reverse().map(([id, l]) => {
          const m = membres[l.membre_id];
          const gain = config.taux_branche || 0;
          totals[l.membre_id] = (totals[l.membre_id] || 0) + gain;
          grand += gain;
          const g = m ? gradeInfo(m.grade) : null;
          return `<tr>
            <td>${g ? g.emoji : '❓'} ${m ? m.prenom : 'Membre supprimé'}</td>
            <td>🌿 ${l.branche_nom || '—'}</td>
            <td>${l.fertilisant || 0}</td>
            <td>${l.eau || 0}</td>
            <td>${l.graines || 0}</td>
            <td>${l.pots || 0}</td>
            <td class="amt">${fmtMoney(gain)}</td>
            <td><button class="del" data-id="${id}" data-type="labos">✕</button></td>
          </tr>`;
        }).join('');
      }
      renderTotalsChips('l-totals', totals);
      document.getElementById('l-grand').textContent = 'Total équipe : ' + fmtMoney(grand);
    });

    // Retire au mieux les quantités saisies du stock (catégorie "Labo"), sans jamais bloquer l'enregistrement
    async function deduireStockLabo({ fertilisant, eau, graines, pots }) {
      try {
        const stockSnap = await db.ref('stock').get();
        const cats = entries(stockSnap.val());
        const catLabo = cats.find(([id, c]) => (c.nom || '').toLowerCase().includes('labo'));
        if (!catLabo) return;
        const [catId, cat] = catLabo;
        const produits = entries(cat.produits);
        const conso = [
          { match: 'fertilisant', qty: fertilisant },
          { match: 'eau', qty: eau },
          { match: 'graine', qty: graines },
          { match: 'pot', qty: pots },
        ];
        for (const c of conso) {
          if (!c.qty) continue;
          const prod = produits.find(([pid, p]) => (p.nom || '').toLowerCase().includes(c.match));
          if (!prod) continue;
          const [pid, p] = prod;
          const ref = db.ref(`stock/${catId}/produits/${pid}/stock`);
          const cur = (await ref.get()).val() || 0;
          await ref.set(Math.max(0, cur - c.qty));
        }
      } catch (err) {
        console.error('deduireStockLabo', err); // jamais bloquant
      }
    }

    document.getElementById('form-labo').addEventListener('submit', e => {
      e.preventDefault();
      const membre_id = document.getElementById('l-member').value;
      const fertilisant = parseInt(document.getElementById('l-fertilisant').value, 10) || 0;
      const eau = parseInt(document.getElementById('l-eau').value, 10) || 0;
      const graines = parseInt(document.getElementById('l-graines').value, 10) || 0;
      const pots = parseInt(document.getElementById('l-pots').value, 10) || 0;
      const branche_nom = document.getElementById('l-branche').value.trim();
      const note = document.getElementById('l-note').value.trim();
      if (!membre_id || !branche_nom) return;
      db.ref('labos/' + uid()).set({
        membre_id, fertilisant, eau, graines, pots, branche_nom, note,
        date: new Date().toISOString(), par: membre.id, semaine_id: activeWeekId
      });
      deduireStockLabo({ fertilisant, eau, graines, pots });
      document.getElementById('form-labo').reset();
    });

    // ---- delete (délégué) ----
    document.body.addEventListener('click', e => {
      if (e.target.classList.contains('del')) {
        const id = e.target.dataset.id;
        const type = e.target.dataset.type;
        db.ref(type + '/' + id).remove();
      }
    });

    // ---- membres + config en direct ----
    db.ref('membres').on('value', snap => {
      membres = Object.fromEntries(entries(snap.val()));
      fillMemberSelects();
    });
    db.ref('config').on('value', snap => {
      config = Object.assign({ taux_action_pct: 25, taux_cambriolage: 700, taux_pochon: 25 }, snap.val() || {});
      renderHints();
    });
  }
</script>
</body>
</html>
