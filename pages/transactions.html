<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Mugiwara — Transactions</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="pagehead">
      <h2 id="pagehead-title">Transactions</h2>
      <div class="rule"></div>
    </div>

    <div class="card">
      <h3>Nouvelle transaction</h3>
      <form class="entry" id="form-tx">
        <div class="field"><label>Type</label>
          <select id="t-type"><option value="vente">Vente</option><option value="achat">Achat</option></select>
        </div>
        <div class="field"><label>Produit</label><input type="text" id="t-produit" placeholder="Nom du produit" required></div>
        <div class="field"><label>Quantité</label><input type="number" id="t-qty" min="1" step="1" value="1" required></div>
        <div class="field"><label>Prix total ($)</label><input type="number" id="t-prix" min="0" step="1" required></div>
        <div class="field"><label>Argent</label>
          <select id="t-typeargent"><option value="sale">Sale</option><option value="propre">Propre</option></select>
        </div>
        <div class="field"><label>Notes</label><input type="text" id="t-notes" placeholder="optionnel"></div>
        <button class="submit" type="submit">Enregistrer</button>
      </form>
    </div>

    <div class="card">
      <h3>Historique</h3>
      <table>
        <thead><tr><th>Membre</th><th>Type</th><th>Produit</th><th>Qté</th><th>Prix</th><th>Argent</th><th>Notes</th><th></th></tr></thead>
        <tbody id="tx-table"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
  const membre = initShell('transactions', 'Transactions');
  if (membre) {
    let membresMap = {};
    db.ref('membres').on('value', s => { membresMap = Object.fromEntries(entries(s.val())); });

    document.getElementById('form-tx').addEventListener('submit', e => {
      e.preventDefault();
      const type = document.getElementById('t-type').value;
      const produit_nom = document.getElementById('t-produit').value.trim();
      const quantite = parseInt(document.getElementById('t-qty').value, 10);
      const prix = parseFloat(document.getElementById('t-prix').value);
      const type_argent = document.getElementById('t-typeargent').value;
      const notes = document.getElementById('t-notes').value.trim();
      if (!produit_nom || isNaN(quantite) || isNaN(prix)) return;
      db.ref('transactions/' + uid()).set({
        type, produit_nom, quantite, prix, type_argent, notes,
        membre_id: membre.id, date: new Date().toISOString()
      });
      document.getElementById('form-tx').reset();
      document.getElementById('t-qty').value = '1';
    });

    db.ref('transactions').on('value', snap => {
      const rows = entries(snap.val());
      const tbody = document.getElementById('tx-table');
      tbody.innerHTML = rows.length === 0
        ? `<tr><td colspan="8" class="empty">Aucune transaction enregistrée.</td></tr>`
        : rows.slice().reverse().map(([id, t]) => {
            const m = membresMap[t.membre_id];
            const g = m ? gradeInfo(m.grade) : null;
            return `<tr>
              <td>${g ? g.emoji : '❓'} ${m ? m.prenom : '?'}</td>
              <td>${t.type === 'vente' ? '💸 Vente' : '🛒 Achat'}</td>
              <td>${t.produit_nom}</td>
              <td>${t.quantite}</td>
              <td class="amt">${fmtMoney(t.prix)}</td>
              <td>${t.type_argent === 'propre' ? '💵 Propre' : '🕶️ Sale'}</td>
              <td>${t.notes || '—'}</td>
              <td><button class="del" data-id="${id}">✕</button></td>
            </tr>`;
          }).join('');
    });

    document.body.addEventListener('click', e => {
      if (e.target.matches('#tx-table .del')) db.ref('transactions/' + e.target.dataset.id).remove();
    });
  }
</script>
</body>
</html>
