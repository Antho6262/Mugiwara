<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Mugiwara — Paye</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="pagehead">
      <h2 id="pagehead-title">Paye</h2>
      <div class="rule"></div>
    </div>
    <div class="note-hint" style="margin-bottom:16px;">Paye en argent sale uniquement — réservé aux grades Sergent et plus.</div>

    <div class="card">
      <h3>À payer</h3>
      <table>
        <thead><tr><th>Membre</th><th>Gains totaux</th><th>Déjà payé</th><th>Reste à payer</th><th></th></tr></thead>
        <tbody id="paye-body"></tbody>
      </table>
    </div>

    <div class="card">
      <h3>Historique des paiements</h3>
      <table>
        <thead><tr><th>Membre</th><th>Montant</th><th>Par</th><th>Date</th></tr></thead>
        <tbody id="hist-body"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
  const membre = initShell('paye', 'Paye');
  if (membre) {
    let membresMap = {};

    function refresh() {
      Promise.all([db.ref('membres').get(), computeSoldes()]).then(([mSnap, soldes]) => {
        membresMap = Object.fromEntries(entries(mSnap.val()));
        const { gainsParMembre, payeParMembre, aPayerParMembre } = soldes;

        const rows = Object.entries(membresMap).filter(([id]) => (gainsParMembre[id] || 0) > 0).map(([id, m]) => {
          const g = gradeInfo(m.grade);
          const total = gainsParMembre[id] || 0;
          const deja = payeParMembre[id] || 0;
          const reste = aPayerParMembre[id] || 0;
          return `<tr>
            <td>${g.emoji} ${m.prenom}</td>
            <td>${fmtMoney(total)}</td>
            <td>${fmtMoney(deja)}</td>
            <td class="amt">${fmtMoney(reste)}</td>
            <td>${canManage(membre) && reste > 0 ? `<button class="submit" data-id="${id}" data-montant="${reste}" style="padding:6px 14px;font-size:13px;">Payer</button>` : ''}</td>
          </tr>`;
        }).join('');
        document.getElementById('paye-body').innerHTML = rows || `<tr><td colspan="5" class="empty">Aucun gain enregistré pour le moment.</td></tr>`;
      });
    }
    refresh();

    document.body.addEventListener('click', e => {
      if (e.target.matches('#paye-body button[data-id]')) {
        const membre_id = e.target.dataset.id;
        const montant = parseFloat(e.target.dataset.montant);
        db.ref('payes/' + uid()).set({ membre_id, montant, par: membre.prenom, date: new Date().toISOString() })
          .then(() => { toast('Paiement enregistré.'); refresh(); });
      }
    });

    db.ref('payes').on('value', snap => {
      const rows = entries(snap.val());
      const tbody = document.getElementById('hist-body');
      tbody.innerHTML = rows.length === 0
        ? `<tr><td colspan="4" class="empty">Aucun paiement enregistré.</td></tr>`
        : rows.slice().reverse().map(([id, p]) => {
            const m = membresMap[p.membre_id];
            const g = m ? gradeInfo(m.grade) : null;
            const d = p.date ? new Date(p.date).toLocaleDateString('fr-FR') : '—';
            return `<tr>
              <td>${g ? g.emoji : '❓'} ${m ? m.prenom : '?'}</td>
              <td class="amt">${fmtMoney(p.montant)}</td>
              <td>${p.par || '—'}</td>
              <td>${d}</td>
            </tr>`;
          }).join('');
    });
  }
</script>
</body>
</html>
