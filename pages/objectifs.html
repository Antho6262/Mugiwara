<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Objectifs — The Roolio Family</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="shell"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
let SESSION;

function barre(pct, color) {
  return `<div style="background:var(--bg-2); border-radius:6px; height:10px; overflow:hidden; flex:1;">
    <div style="height:100%; width:${Math.min(100, pct)}%; background:${color};"></div></div>`;
}

function renderContent() {
  document.getElementById("content").innerHTML = `
    <h1>Objectifs</h1>
    <div class="sigil-rule"></div>

    <div class="panel mt16">
      <div class="panel-head"><h2>Objectif collectif (gains $ — semaine active)</h2></div>
      <div class="row" style="align-items:center;">
        ${SESSION.role === 'admin' ? '<input type="number" id="cibleCollective" style="max-width:160px" placeholder="Cible $">' : ''}
        <div id="barreCollective" style="display:flex; align-items:center; gap:10px; flex:1;"></div>
      </div>
      ${SESSION.role === 'admin' ? '<button class="btn btn-primary mt16" onclick="majCibleCollective()">Enregistrer la cible</button>' : ''}
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Objectifs personnels (actions — semaine active)</h2></div>
      <table><thead><tr><th>Membre</th><th>Cible</th><th>Réalisé</th><th>Progression</th>${SESSION.role === 'admin' ? '<th></th>' : ''}</tr></thead>
        <tbody id="tblObjMembres"><tr class="empty-row"><td colspan="5">Chargement…</td></tr></tbody></table>
    </div>
  `;
}

let DATA = { semaines: {}, membres: {}, objCfg: {}, objMembres: {}, actions: {} };
let ACTIVE_WEEK_ID = null, ACTIONS_REF = null;

function recomputeWeek() {
  const list = entries(DATA.semaines).map(([id, s]) => ({ id, ...s })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const week = list.find(s => s.bloquee !== true) || list[0] || null;
  const newId = week ? week.id : null;
  if (newId !== ACTIVE_WEEK_ID) {
    if (ACTIONS_REF) ACTIONS_REF.off("value", onActionsChange);
    ACTIVE_WEEK_ID = newId;
    DATA.actions = {};
    if (ACTIVE_WEEK_ID) {
      ACTIONS_REF = db.ref("actions/" + ACTIVE_WEEK_ID);
      ACTIONS_REF.on("value", onActionsChange);
    } else {
      ACTIONS_REF = null;
      renderDerived();
    }
    return;
  }
  renderDerived();
}

function onActionsChange(snap) {
  DATA.actions = snap.val() || {};
  renderDerived();
}

function renderDerived() {
  const membres = entries(DATA.membres).map(([id, m]) => ({ id, ...m })).filter(m => m.actif !== false);
  const actions = entries(DATA.actions).map(([id, a]) => a);
  const cfg = DATA.objCfg;
  const cibleCollective = Number(Object.values(cfg)[0]?.cible) || 0;
  const objCfgId = Object.keys(cfg)[0] || null;
  window._objCfgId = objCfgId;

  const gainsTotal = actions.reduce((acc, a) => acc + Number(a.gains_totaux || 0), 0);
  const pctCollectif = cibleCollective > 0 ? Math.round(gainsTotal / cibleCollective * 100) : 0;
  document.getElementById("barreCollective").innerHTML = barre(pctCollectif, pctCollectif >= 100 ? 'var(--success)' : 'var(--gold)') +
    `<span class="small muted" style="white-space:nowrap;">${formatMoney(gainsTotal)} / ${formatMoney(cibleCollective)}</span>`;
  const inputCible = document.getElementById("cibleCollective");
  if (inputCible && document.activeElement !== inputCible) inputCible.value = cibleCollective;

  const objMembres = DATA.objMembres;
  document.getElementById("tblObjMembres").innerHTML = membres.length ? membres.map(m => {
    const objData = objMembres[m.id] || {};
    const objId = Object.keys(objData)[0];
    const cible = objId ? Number(objData[objId].cible) || 0 : 0;
    const fait = actions.filter(a => a.membre_id === m.id && a.resultat === "Réussite").reduce((acc, a) => acc + Number(a.quantite || 0), 0);
    const pct = cible > 0 ? Math.round(fait / cible * 100) : 0;
    return `<tr><td>${m.prenom}</td>
      <td>${SESSION.role === 'admin' ? `<input type="number" value="${cible}" style="max-width:90px" onchange="majObjMembre('${m.id}','${objId || ''}', this.value)">` : cible}</td>
      <td>${fait}</td>
      <td style="display:flex; align-items:center; gap:8px;">${barre(pct, pct >= 100 ? 'var(--success)' : 'var(--steel)')}<span class="small muted">${pct}%</span></td>
      ${SESSION.role === 'admin' ? '<td></td>' : ''}
    </tr>`;
  }).join("") : '<tr class="empty-row"><td colspan="5">Aucun membre</td></tr>';
}

async function majCibleCollective() {
  const val = Number(document.getElementById("cibleCollective").value) || 0;
  const id = window._objCfgId || uid();
  await db.ref("objectifs_config/" + id).set({ cible: val });
  toast("Cible collective enregistrée.");
}
async function majObjMembre(membreId, objId, val) {
  const id = objId || uid();
  await db.ref("objectifs_membres/" + membreId + "/" + id).set({ cible: Number(val) || 0 });
  toast("Objectif mis à jour.");
}

(async function () {
  await authReady;
  SESSION = await initShell("objectifs", "Objectifs");
  if (!SESSION) return;
  renderContent();
  db.ref("semaines").on("value", snap => { DATA.semaines = snap.val() || {}; recomputeWeek(); });
  db.ref("membres").on("value", snap => { DATA.membres = snap.val() || {}; renderDerived(); });
  db.ref("objectifs_config").on("value", snap => { DATA.objCfg = snap.val() || {}; renderDerived(); });
  db.ref("objectifs_membres").on("value", snap => { DATA.objMembres = snap.val() || {}; renderDerived(); });
})();
</script>
</body>
</html>
