<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Mugiwara — Taxes</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="pagehead">
      <h2 id="pagehead-title">Taxes</h2>
      <div class="rule"></div>
    </div>

    <div class="card">
      <div class="field" style="max-width:340px;">
        <label>Semaine affichée</label>
        <select id="tx-semaine"></select>
      </div>
    </div>

    <div class="card">
      <h3>Nouvelle taxe</h3>
      <form class="entry" id="form-taxe">
        <div class="field"><label>Membre</label><select id="tx-membre" required></select></div>
        <div class="field"><label>Type de taxe</label><select id="tx-type" required></select></div>
        <div class="field"><label>Montant ($)</label><input type="number" id="tx-montant" min="0" step="1" required></div>
        <div class="field"><label>Argent</label>
          <select id="tx-argent"><option value="sale">Sale</option><option value="propre">Propre</option></select>
        </div>
        <div class="field"><label>Notes</label><input type="text" id="tx-notes" placeholder="optionnel"></div>
        <button class="submit" type="submit">Enregistrer</button>
      </form>
    </div>

    <div class="card" id="new-type-card" style="display:none;">
      <h3>Nouveau type de taxe</h3>
      <form class="entry" id="form-type">
        <div class="field"><label>Nom</label><input type="text" id="ty-nom" placeholder="Ex: Taxe de territoire" required></div>
        <button class="submit" type="submit">Créer</button>
      </form>
    </div>

    <div class="card">
      <h3>Historique</h3>
      <table>
        <thead><tr><th>Membre</th><th>Type</th><th>Montant</th><th>Argent</th><th>Notes</th><th></th></tr></thead>
        <tbody id="tx-table"></tbody>
      </table>
      <div class="grand" id="tx-grand"></div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
  const membre = initShell('taxes', 'Taxes');
  if (membre) {
    if (canManage(membre)) document.getElementById('new-type-card').style.display = 'block';

    let membresMap = {}, typesMap = {};
    let semaineFiltre = '';
    let activeWeekId = null;
    let lastSnap = null;

    db.ref('config/semaine_active_id').on('value', s => { activeWeekId = s.val(); });

    async function chargerSemaines() {
      const allSnap = await db.ref('semaines').get();
      const all = entries(allSnap.val()).sort((a, b) => (b[1].debut || '').localeCompare(a[1].debut || ''));
      const sel = document.getElementById('tx-semaine');
      sel.innerHTML =
        all.map(([id, s]) => `<option value="${id}">${s.nom}${s.bloquee ? ' 🔒' : ' 🟢'}${id === activeWeekId ? ' (active)' : ''}</option>`).join('') +
        '<option value="">— Toutes les semaines —</option>';
      sel.value = ''; // par défaut : toutes les semaines (les taxes antérieures n'ont pas de semaine associée)
      semaineFiltre = sel.value;
      renderHistorique();
      sel.addEventListener('change', () => { semaineFiltre = sel.value; renderHistorique(); });
    }

    db.ref('membres').on('value', s => {
      membresMap = Object.fromEntries(entries(s.val()));
      document.getElementById('tx-membre').innerHTML = Object.entries(membresMap)
        .filter(([id, m]) => !m.invisible || id === membre.id)
        .map(([id, m]) => `<option value="${id}">${gradeInfo(m.grade).emoji} ${m.prenom}</option>`).join('')
        || '<option value="">Aucun membre</option>';
    });

    db.ref('types_taxes').on('value', s => {
      typesMap = Object.fromEntries(entries(s.val()));
      document.getElementById('tx-type').innerHTML = Object.entries(typesMap)
        .map(([id, t]) => `<option value="${id}">${t.nom}</option>`).join('')
        || '<option value="">Aucun type — crée-en un</option>';
    });

    document.getElementById('form-type').addEventListener('submit', e => {
      e.preventDefault();
      const nom = document.getElementById('ty-nom').value.trim();
      if (!nom) return;
      db.ref('types_taxes/' + uid()).set({ nom });
      document.getElementById('form-type').reset();
    });

    document.getElementById('form-taxe').addEventListener('submit', e => {
      e.preventDefault();
      const membre_id = document.getElementById('tx-membre').value;
      const taxe_id = document.getElementById('tx-type').value;
      const montant = parseFloat(document.getElementById('tx-montant').value);
      const type_argent = document.getElementById('tx-argent').value;
      const notes = document.getElementById('tx-notes').value.trim();
      if (!membre_id || !taxe_id || isNaN(montant)) return;
      db.ref('taxes/' + uid()).set({
        membre_id, taxe_id, taxe_nom: (typesMap[taxe_id] || {}).nom || '—',
        montant, type_argent, notes, date: new Date().toISOString(), semaine_id: activeWeekId
      });
      document.getElementById('form-taxe').reset();
    });

    function renderHistorique() {
      if (!lastSnap) return;
      const rows = entries(lastSnap.val()).filter(([, t]) => !semaineFiltre || t.semaine_id === semaineFiltre);
      const tbody = document.getElementById('tx-table');
      let grand = 0;
      tbody.innerHTML = rows.length === 0
        ? `<tr><td colspan="6" class="empty">Aucune taxe enregistrée pour cette période.</td></tr>`
        : rows.slice().reverse().map(([id, t]) => {
            const m = membresMap[t.membre_id];
            const g = m ? gradeInfo(m.grade) : null;
            grand += (t.montant || 0);
            return `<tr>
              <td>${g ? g.emoji : '❓'} ${m ? m.prenom : '?'}</td>
              <td>${t.taxe_nom}</td>
              <td class="amt">${fmtMoney(t.montant)}</td>
              <td>${t.type_argent === 'propre' ? '💵 Propre' : '🕶️ Sale'}</td>
              <td>${t.notes || '—'}</td>
              <td><button class="del" data-id="${id}">✕</button></td>
            </tr>`;
          }).join('');
      document.getElementById('tx-grand').textContent = 'Total payé : ' + fmtMoney(grand);
    }
    db.ref('taxes').on('value', snap => { lastSnap = snap; renderHistorique(); });
    chargerSemaines();

    document.body.addEventListener('click', e => {
      if (e.target.matches('#tx-table .del')) db.ref('taxes/' + e.target.dataset.id).remove();
    });
  }
</script>
</body>
</html>
