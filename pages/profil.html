<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Mugiwara — Profil</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="pagehead">
      <h2 id="pagehead-title">Profil</h2>
      <div class="rule"></div>
    </div>

    <div class="grid cols-4" id="stats"></div>

    <div class="card">
      <h3>Mon compte</h3>
      <form class="entry" id="form-pass">
        <div class="field"><label>Nouveau mot de passe</label><input type="text" id="p-pass" placeholder="••••••••" required></div>
        <button class="submit" type="submit">Changer le mot de passe</button>
      </form>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
  const membre = initShell('profil', 'Profil');
  if (membre) {
    Promise.all([
      db.ref('actions').get(),
      db.ref('cambriolages').get(),
      db.ref('ventes').get(),
      db.ref('config').get()
    ]).then(([aSnap, gSnap, vSnap, cSnap]) => {
      const cfg = cSnap.val() || { taux_action_pct: 25, taux_cambriolage: 700, taux_pochon: 25 };
      const mine = id => id === membre.id;

      const totalActions = entries(aSnap.val()).filter(([id, a]) => mine(a.membre_id))
        .reduce((s, [id, a]) => s + (a.montant || 0) * (cfg.taux_action_pct / 100), 0);
      const totalGofast = entries(gSnap.val()).filter(([id, g]) => mine(g.membre_id))
        .reduce((s, [id, g]) => s + (g.count || 0) * cfg.taux_cambriolage, 0);
      const totalVente = entries(vSnap.val()).filter(([id, v]) => mine(v.membre_id))
        .reduce((s, [id, v]) => s + (v.qty || 0) * cfg.taux_pochon, 0);

      document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="v">${fmtMoney(totalActions + totalGofast + totalVente)}</div><div class="l">Mon total</div></div>
        <div class="stat"><div class="v">${fmtMoney(totalActions)}</div><div class="l">🏴‍☠️ Actions</div></div>
        <div class="stat"><div class="v">${fmtMoney(totalGofast)}</div><div class="l">🏠 Cambriolage</div></div>
        <div class="stat"><div class="v">${fmtMoney(totalVente)}</div><div class="l">💊 Vente</div></div>
      `;
    });

    document.getElementById('form-pass').addEventListener('submit', e => {
      e.preventDefault();
      const pass = document.getElementById('p-pass').value;
      if (!pass) return;
      db.ref('membres/' + membre.id).update({ mot_de_passe: pass }).then(() => {
        document.getElementById('p-pass').value = '';
        toast('Mot de passe changé.');
      });
    });
  }
</script>
</body>
</html>
