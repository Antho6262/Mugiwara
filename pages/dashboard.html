<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Mugiwara — Dashboard</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="pagehead">
      <h2 id="pagehead-title">Dashboard</h2>
      <div class="rule"></div>
    </div>
    <div class="note-hint" style="margin-bottom:16px;">🗓️ Payes le dimanche à 19h par un haut gradé (Lead → Sergent) — argent sale uniquement. 🏆 Récompenses pour les 3 meilleurs de la semaine.</div>

    <div class="grid cols-4" id="stats"></div>
    <div class="grid cols-3" id="soldes" style="margin:16px 0;"></div>

    <div class="card">
      <h3>🏆 Top 3 de la semaine</h3>
      <table>
        <thead><tr><th></th><th>Membre</th><th>Grade</th><th>Gagné cette semaine</th></tr></thead>
        <tbody id="podium-body"></tbody>
      </table>
    </div>

    <div class="card">
      <h3>Classement de l'équipage</h3>
      <table>
        <thead><tr><th>Membre</th><th>Grade</th><th>Part due</th></tr></thead>
        <tbody id="ranking-body"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
  const membre = initShell('dashboard', 'Dashboard');
  if (membre) {
    Promise.all([
      db.ref('membres').get(),
      db.ref('actions').get(),
      db.ref('cambriolages').get(),
      db.ref('ventes').get(),
      db.ref('labos').get(),
      db.ref('fleecas').get(),
      db.ref('armureries').get(),
      db.ref('config').get()
    ]).then(([mSnap, aSnap, gSnap, vSnap, lSnap, flSnap, arSnap, cSnap]) => {
      const membres = Object.fromEntries(entries(mSnap.val()));
      const cfg = cSnap.val() || { taux_action_pct: 25, taux_cambriolage: 700, taux_pochon: 25, taux_branche: 10 };
      const actions = entries(aSnap.val()).filter(([,a]) => a.resultat !== 'Échec');
      const gofasts = entries(gSnap.val()).filter(([,g]) => g.resultat !== 'Échec');
      const ventes = entries(vSnap.val()).filter(([,v]) => v.resultat !== 'Échec');
      const labos = entries(lSnap.val()).filter(([,l]) => l.resultat !== 'Échec');
      const fleecas = entries(flSnap.val()).filter(([,r]) => r.resultat !== 'Échec');
      const armureries = entries(arSnap.val()).filter(([,r]) => r.resultat !== 'Échec');

      let totalActions = 0, totalGofast = 0, totalVente = 0, totalLabo = 0, totalBraquages = 0;
      const partParMembre = {}; // part due (commission) par membre

      actions.forEach(([id, a]) => {
        const montant = a.montant || 0;
        totalActions += montant;
        partParMembre[a.membre_id] = (partParMembre[a.membre_id] || 0) + montant * (cfg.taux_action_pct / 100);
      });
      gofasts.forEach(([id, g]) => {
        const montant = g.montant || 0;
        totalGofast += montant;
        partParMembre[g.membre_id] = (partParMembre[g.membre_id] || 0) + (g.count || 0) * cfg.taux_cambriolage;
      });
      ventes.forEach(([id, v]) => {
        const montant = v.montant || 0;
        totalVente += montant;
        partParMembre[v.membre_id] = (partParMembre[v.membre_id] || 0) + (v.qty || 0) * cfg.taux_pochon;
      });
      labos.forEach(([id, l]) => {
        const montant = l.montant || 0;
        totalLabo += montant;
        partParMembre[l.membre_id] = (partParMembre[l.membre_id] || 0) + (l.branche_qty || 0) * (cfg.taux_branche || 0);
      });
      fleecas.forEach(([id, r]) => { totalBraquages += (r.montant || 0); }); // pas de part individuelle
      armureries.forEach(([id, r]) => { totalBraquages += (r.montant || 0); });

      const totalGeneral = totalActions + totalGofast + totalVente + totalLabo + totalBraquages;

      document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="v">${fmtMoney(totalGeneral)}</div><div class="l">Total réel gagné (groupe)</div></div>
        <div class="stat"><div class="v">${fmtMoney(totalActions)}</div><div class="l">🏴‍☠️ Actions</div></div>
        <div class="stat"><div class="v">${fmtMoney(totalGofast)}</div><div class="l">🏠 Cambriolage</div></div>
        <div class="stat"><div class="v">${fmtMoney(totalVente + totalLabo)}</div><div class="l">💊 Vente + Labo</div></div>
        <div class="stat"><div class="v">${fmtMoney(totalBraquages)}</div><div class="l">🏦 Fleeca + 🔫 Armurerie</div></div>
      `;

      const rows = Object.entries(partParMembre)
        .map(([id, total]) => ({ id, total, m: membres[id] }))
        .filter(r => r.m)
        .sort((a, b) => b.total - a.total);

      document.getElementById('ranking-body').innerHTML = rows.length === 0
        ? `<tr><td colspan="3" class="empty">Aucune activité enregistrée pour le moment.</td></tr>`
        : rows.map(r => {
            const g = gradeInfo(r.m.grade);
            return `<tr>
              <td>${r.m.prenom}</td>
              <td>${g.emoji} ${g.nom}</td>
              <td class="amt">${fmtMoney(r.total)}</td>
            </tr>`;
          }).join('');
    });

    // ---- Top 3 de la semaine (part due) ----
    Promise.all([
      db.ref('membres').get(),
      db.ref('actions').get(),
      db.ref('cambriolages').get(),
      db.ref('ventes').get(),
      db.ref('labos').get(),
      db.ref('config').get()
    ]).then(([mSnap, aSnap, gSnap, vSnap, lSnap, cSnap]) => {
      const membres = Object.fromEntries(entries(mSnap.val()));
      const cfg = cSnap.val() || { taux_action_pct: 25, taux_cambriolage: 700, taux_pochon: 25, taux_branche: 10 };
      const activeWeekId = cfg.semaine_active_id;
      const parMembreSemaine = {};

      entries(aSnap.val()).filter(([,a]) => a.semaine_id === activeWeekId && a.resultat !== 'Échec').forEach(([id, a]) => {
        const part = (a.montant || 0) * (cfg.taux_action_pct / 100);
        parMembreSemaine[a.membre_id] = (parMembreSemaine[a.membre_id] || 0) + part;
      });
      entries(gSnap.val()).filter(([,g]) => g.semaine_id === activeWeekId && g.resultat !== 'Échec').forEach(([id, g]) => {
        const part = (g.count || 0) * cfg.taux_cambriolage;
        parMembreSemaine[g.membre_id] = (parMembreSemaine[g.membre_id] || 0) + part;
      });
      entries(vSnap.val()).filter(([,v]) => v.semaine_id === activeWeekId && v.resultat !== 'Échec').forEach(([id, v]) => {
        const part = (v.qty || 0) * cfg.taux_pochon;
        parMembreSemaine[v.membre_id] = (parMembreSemaine[v.membre_id] || 0) + part;
      });
      entries(lSnap.val()).filter(([,l]) => l.semaine_id === activeWeekId && l.resultat !== 'Échec').forEach(([id, l]) => {
        const part = (l.branche_qty || 0) * (cfg.taux_branche || 0);
        parMembreSemaine[l.membre_id] = (parMembreSemaine[l.membre_id] || 0) + part;
      });

      const top3 = Object.entries(parMembreSemaine)
        .map(([id, total]) => ({ id, total, m: membres[id] }))
        .filter(r => r.m)
        .sort((a, b) => b.total - a.total)
        .slice(0, 3);

      const medailles = ['🥇', '🥈', '🥉'];
      document.getElementById('podium-body').innerHTML = top3.length === 0
        ? `<tr><td colspan="4" class="empty">Aucune activité cette semaine pour le moment.</td></tr>`
        : top3.map((r, i) => {
            const g = gradeInfo(r.m.grade);
            return `<tr>
              <td style="font-size:20px;">${medailles[i]}</td>
              <td>${r.m.prenom}</td>
              <td>${g.emoji} ${g.nom}</td>
              <td class="amt">${fmtMoney(r.total)}</td>
            </tr>`;
          }).join('');
    });

    computeSoldes().then(({ solde_sale, solde_propre }) => {
      document.getElementById('soldes').innerHTML = `
        <div class="stat"><div class="v">${fmtMoney(solde_sale)}</div><div class="l">🕶️ Argent sale</div></div>
        <div class="stat"><div class="v">${fmtMoney(solde_propre)}</div><div class="l">💵 Argent propre</div></div>
        <div class="stat"><div class="v">${fmtMoney(solde_sale + solde_propre)}</div><div class="l">🧭 Trésor total</div></div>
      `;
    });
  }
</script>
</body>
</html>
