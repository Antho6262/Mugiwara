<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Mugiwara — Dashboard</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="pagehead">
      <h2 id="pagehead-title">Dashboard</h2>
      <div class="rule"></div>
    </div>
    <div class="note-hint" style="margin-bottom:16px;">🗓️ Payes le dimanche à 19h par un haut gradé (Lead → Sergent) — argent sale uniquement. 🏆 Récompenses pour les 3 meilleurs de la semaine.</div>

    <div class="card" id="capitaine-card" style="display:none;text-align:center;"></div>

    <div class="card">
      <h3>🗺️ Route vers Raftel</h3>
      <div id="carte-tresor"></div>
    </div>

    <div class="card">
      <div class="field" style="max-width:340px;">
        <label>Semaine affichée</label>
        <select id="d-semaine"></select>
      </div>
    </div>

    <div class="grid cols-3" id="soldes" style="margin-bottom:16px;grid-template-columns:repeat(2,1fr);max-width:600px;"></div>
    <div class="grid cols-3" id="cat-cards" style="margin-bottom:16px;"></div>

    <div class="card">
      <h3>🏆 Top 3 de la semaine</h3>
      <table>
        <thead><tr><th></th><th>Membre</th><th>Grade</th><th>Gagné</th></tr></thead>
        <tbody id="podium-body"></tbody>
      </table>
    </div>

    <div class="card">
      <h3>Classement de l'équipage</h3>
      <table>
        <thead><tr><th>Membre</th><th>Grade</th><th>Part due</th></tr></thead>
        <tbody id="ranking-body"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
  const membre = initShell('dashboard', 'Dashboard');
  if (membre) {
    let semaineFiltre = '';
    let dernieresListes = null;

    async function chargerSemaines() {
      const [allSnap, activeSnap] = await Promise.all([
        db.ref('semaines').get(),
        db.ref('config/semaine_active_id').get()
      ]);
      const all = entries(allSnap.val()).sort((a, b) => (b[1].debut || '').localeCompare(a[1].debut || ''));
      const activeId = activeSnap.val();
      const sel = document.getElementById('d-semaine');
      sel.innerHTML =
        all.map(([id, s]) => `<option value="${id}">${s.nom}${s.bloquee ? ' 🔒' : ' 🟢'}${id === activeId ? ' (active)' : ''}</option>`).join('') +
        '<option value="">— Toutes les semaines —</option>';
      sel.value = activeId || '';
      semaineFiltre = sel.value;
      sel.addEventListener('change', () => { semaineFiltre = sel.value; renderTout(); });
    }

    function renderTout() {
      if (!dernieresListes) return;
      const { membres, cfg, actions, gofasts, ventes, labos, fleecas, armureries } = dernieresListes;
      const matchWeek = item => !semaineFiltre || item.semaine_id === semaineFiltre;

      const actionsF = actions.filter(([,a]) => matchWeek(a));
      const gofastsF = gofasts.filter(([,g]) => matchWeek(g));
      const ventesF = ventes.filter(([,v]) => matchWeek(v));
      const labosF = labos.filter(([,l]) => matchWeek(l));
      const fleecasF = fleecas.filter(([,r]) => matchWeek(r));
      const armureriesF = armureries.filter(([,r]) => matchWeek(r));

      let totalActions = 0, totalGofast = 0, totalVente = 0, totalLabo = 0, totalFleeca = 0, totalArmurerie = 0;
      const partParMembre = {};

      actionsF.forEach(([id, a]) => {
        const montant = a.montant || 0;
        totalActions += montant;
        partParMembre[a.membre_id] = (partParMembre[a.membre_id] || 0) + montant * (cfg.taux_action_pct / 100);
      });
      gofastsF.forEach(([id, g]) => {
        totalGofast += (g.montant || 0);
        partParMembre[g.membre_id] = (partParMembre[g.membre_id] || 0) + (g.count || 0) * cfg.taux_cambriolage;
      });
      ventesF.forEach(([id, v]) => {
        totalVente += (v.montant || 0);
        partParMembre[v.membre_id] = (partParMembre[v.membre_id] || 0) + (v.qty || 0) * cfg.taux_pochon;
      });
      labosF.forEach(([id, l]) => {
        totalLabo += (l.montant || 0);
        partParMembre[l.membre_id] = (partParMembre[l.membre_id] || 0) + (l.branche_qty || 0) * (cfg.taux_branche || 0);
      });
      fleecasF.forEach(([id, r]) => { totalFleeca += (r.montant || 0); }); // pas de part individuelle
      armureriesF.forEach(([id, r]) => { totalArmurerie += (r.montant || 0); });

      document.getElementById('cat-cards').innerHTML = `
        <div class="stat"><div class="v">${fmtMoney(totalActions)}</div><div class="l">🏴‍☠️ Actions</div></div>
        <div class="stat"><div class="v">${fmtMoney(totalGofast)}</div><div class="l">🏠 Cambriolage</div></div>
        <div class="stat"><div class="v">${fmtMoney(totalVente)}</div><div class="l">💊 Vente</div></div>
        <div class="stat"><div class="v">${fmtMoney(totalLabo)}</div><div class="l">🧪 Labo</div></div>
        <div class="stat"><div class="v">${fmtMoney(totalFleeca)}</div><div class="l">🏦 Fleeca</div></div>
        <div class="stat"><div class="v">${fmtMoney(totalArmurerie)}</div><div class="l">🔫 Armurerie</div></div>
      `;

      const rows = Object.entries(partParMembre)
        .map(([id, total]) => ({ id, total, m: membres[id] }))
        .filter(r => r.m && !r.m.invisible)
        .sort((a, b) => b.total - a.total);

      document.getElementById('ranking-body').innerHTML = rows.length === 0
        ? `<tr><td colspan="3" class="empty">Aucune activité pour cette période.</td></tr>`
        : rows.map(r => {
            const g = gradeInfo(r.m.grade);
            return `<tr>
              <td>${r.m.prenom}</td>
              <td>${g.emoji} ${g.nom}</td>
              <td class="amt">${fmtMoney(r.total)}</td>
            </tr>`;
          }).join('');

      const top3 = rows.slice(0, 3);
      const medailles = ['🥇', '🥈', '🥉'];
      document.getElementById('podium-body').innerHTML = top3.length === 0
        ? `<tr><td colspan="4" class="empty">Aucune activité pour cette période.</td></tr>`
        : top3.map((r, i) => {
            const g = gradeInfo(r.m.grade);
            return `<tr>
              <td style="font-size:20px;">${medailles[i]}</td>
              <td>${r.m.prenom}</td>
              <td>${g.emoji} ${g.nom}</td>
              <td class="amt">${fmtMoney(r.total)}</td>
            </tr>`;
          }).join('');
    }

    Promise.all([
      db.ref('membres').get(),
      db.ref('actions').get(),
      db.ref('cambriolages').get(),
      db.ref('ventes').get(),
      db.ref('labos').get(),
      db.ref('fleecas').get(),
      db.ref('armureries').get(),
      db.ref('config').get()
    ]).then(([mSnap, aSnap, gSnap, vSnap, lSnap, flSnap, arSnap, cSnap]) => {
      const membres = Object.fromEntries(entries(mSnap.val()));
      const cfg = Object.assign({ taux_action_pct: 25, taux_cambriolage: 700, taux_pochon: 25, taux_branche: 10 }, cSnap.val() || {});
      const actions = entries(aSnap.val()).filter(([,a]) => a.resultat !== 'Échec');
      const gofasts = entries(gSnap.val()).filter(([,g]) => g.resultat !== 'Échec');
      const ventes = entries(vSnap.val()).filter(([,v]) => v.resultat !== 'Échec');
      const labos = entries(lSnap.val()).filter(([,l]) => l.resultat !== 'Échec');
      const fleecas = entries(flSnap.val()).filter(([,r]) => r.resultat !== 'Échec');
      const armureries = entries(arSnap.val()).filter(([,r]) => r.resultat !== 'Échec');

      dernieresListes = { membres, cfg, actions, gofasts, ventes, labos, fleecas, armureries };
      chargerSemaines().then(renderTout);

      // Capitaine du jour (surprise cosmétique)
      const membresActifs = Object.entries(membres).filter(([id, m]) => m.actif !== false && !m.invisible);
      const capitaine = capitaineDuJour(membresActifs);
      if (capitaine) {
        const [, m] = capitaine;
        const g = gradeInfo(m.grade);
        document.getElementById('capitaine-card').style.display = 'block';
        document.getElementById('capitaine-card').innerHTML =
          `<div style="font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:2px;color:var(--muted);">CAPITAINE DU JOUR</div>
           <div style="font-family:'Pirata One',cursive;font-size:28px;color:var(--gold);margin-top:4px;">👑 ${m.prenom} ${g.emoji}</div>`;
      }

      // Carte au trésor — total historique (toutes semaines, hors échecs)
      const totalHistorique =
        actions.reduce((s, [,a]) => s + (a.montant || 0), 0) +
        gofasts.reduce((s, [,g]) => s + (g.montant || 0), 0) +
        ventes.reduce((s, [,v]) => s + (v.montant || 0), 0) +
        labos.reduce((s, [,l]) => s + (l.montant || 0), 0) +
        fleecas.reduce((s, [,r]) => s + (r.montant || 0), 0) +
        armureries.reduce((s, [,r]) => s + (r.montant || 0), 0);
      renderCarteTresor(totalHistorique);
    });

    function renderCarteTresor(total) {
      const etapes = [
        { seuil: 0,       label: 'Départ',   emoji: '⚓' },
        { seuil: 5000,    label: '$5k',      emoji: '🏝️' },
        { seuil: 20000,   label: '$20k',     emoji: '🏝️' },
        { seuil: 75000,   label: '$75k',     emoji: '🌋' },
        { seuil: 250000,  label: '$250k',    emoji: '🗿' },
        { seuil: 750000,  label: 'Raftel',   emoji: '🏴‍☠️' },
      ];
      const positions = etapes.map((e, i) => (i / (etapes.length - 1)) * 100);

      // position du bateau : interpolation entre les deux étapes encadrant le total
      let pct = positions[0];
      for (let i = 0; i < etapes.length - 1; i++) {
        const a = etapes[i], b = etapes[i + 1];
        if (total >= a.seuil && total <= b.seuil) {
          const ratio = b.seuil === a.seuil ? 1 : (total - a.seuil) / (b.seuil - a.seuil);
          pct = positions[i] + ratio * (positions[i + 1] - positions[i]);
          break;
        }
        if (total > etapes[etapes.length - 1].seuil) pct = 100;
      }

      const iles = etapes.map((e, i) => `
        <div class="tresor-ile ${total >= e.seuil ? 'atteinte' : ''}" style="left:${positions[i]}%;">
          <span>${e.emoji}</span>
          <span class="label">${e.label}</span>
        </div>`).join('');

      document.getElementById('carte-tresor').innerHTML = `
        <div class="tresor-route">
          <div class="tresor-ligne"></div>
          ${iles}
          <div class="tresor-bateau" style="left:${pct}%;">⛵</div>
        </div>
        <div class="tresor-progres">${fmtMoney(total)} gagnés au total — cap sur Raftel 🏴‍☠️</div>
      `;
    }

    computeSoldes().then(({ solde_sale, solde_propre }) => {
      document.getElementById('soldes').innerHTML = `
        <div class="stat"><div class="v">${fmtMoney(solde_sale)}</div><div class="l">🕶️ Argent sale</div></div>
        <div class="stat"><div class="v">${fmtMoney(solde_propre)}</div><div class="l">💵 Argent propre</div></div>
      `;
    });
  }
</script>
</body>
</html>
