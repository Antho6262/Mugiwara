<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Mugiwara — Dashboard</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="pagehead">
      <h2 id="pagehead-title">Dashboard</h2>
      <div class="rule"></div>
    </div>

    <div class="grid cols-4" id="stats"></div>
    <div class="grid cols-3" id="soldes" style="margin:16px 0;"></div>

    <div class="card">
      <h3>Classement de l'équipage</h3>
      <table>
        <thead><tr><th>Membre</th><th>Grade</th><th>Total gagné</th></tr></thead>
        <tbody id="ranking-body"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
  const membre = initShell('dashboard', 'Dashboard');
  if (membre) {
    Promise.all([
      db.ref('membres').get(),
      db.ref('actions').get(),
      db.ref('gofasts').get(),
      db.ref('ventes').get(),
      db.ref('config').get()
    ]).then(([mSnap, aSnap, gSnap, vSnap, cSnap]) => {
      const membres = Object.fromEntries(entries(mSnap.val()));
      const cfg = cSnap.val() || { taux_action_pct: 25, taux_gofast: 700, taux_pochon: 25 };
      const actions = entries(aSnap.val());
      const gofasts = entries(gSnap.val());
      const ventes = entries(vSnap.val());

      let totalActions = 0, totalGofast = 0, totalVente = 0;
      const parMembre = {};

      actions.forEach(([id, a]) => {
        const gain = (a.montant || 0) * (cfg.taux_action_pct / 100);
        totalActions += gain;
        parMembre[a.membre_id] = (parMembre[a.membre_id] || 0) + gain;
      });
      gofasts.forEach(([id, g]) => {
        const gain = (g.count || 0) * cfg.taux_gofast;
        totalGofast += gain;
        parMembre[g.membre_id] = (parMembre[g.membre_id] || 0) + gain;
      });
      ventes.forEach(([id, v]) => {
        const gain = (v.qty || 0) * cfg.taux_pochon;
        totalVente += gain;
        parMembre[v.membre_id] = (parMembre[v.membre_id] || 0) + gain;
      });

      const totalGeneral = totalActions + totalGofast + totalVente;

      document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="v">${fmtMoney(totalGeneral)}</div><div class="l">Total général</div></div>
        <div class="stat"><div class="v">${fmtMoney(totalActions)}</div><div class="l">🏴‍☠️ Actions</div></div>
        <div class="stat"><div class="v">${fmtMoney(totalGofast)}</div><div class="l">🚗 Go Fast</div></div>
        <div class="stat"><div class="v">${fmtMoney(totalVente)}</div><div class="l">💊 Vente</div></div>
      `;

      const rows = Object.entries(parMembre)
        .map(([id, total]) => ({ id, total, m: membres[id] }))
        .filter(r => r.m)
        .sort((a, b) => b.total - a.total);

      document.getElementById('ranking-body').innerHTML = rows.length === 0
        ? `<tr><td colspan="3" class="empty">Aucune activité enregistrée pour le moment.</td></tr>`
        : rows.map(r => {
            const g = gradeInfo(r.m.grade);
            return `<tr>
              <td>${r.m.prenom}</td>
              <td>${g.emoji} ${g.nom}</td>
              <td class="amt">${fmtMoney(r.total)}</td>
            </tr>`;
          }).join('');
    });

    computeSoldes().then(({ solde_sale, solde_propre }) => {
      document.getElementById('soldes').innerHTML = `
        <div class="stat"><div class="v">${fmtMoney(solde_sale)}</div><div class="l">🕶️ Argent sale</div></div>
        <div class="stat"><div class="v">${fmtMoney(solde_propre)}</div><div class="l">💵 Argent propre</div></div>
        <div class="stat"><div class="v">${fmtMoney(solde_sale + solde_propre)}</div><div class="l">🧭 Trésor total</div></div>
      `;
    });
  }
</script>
</body>
</html>
