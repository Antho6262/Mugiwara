<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Mugiwara — Admin</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="pagehead">
      <h2 id="pagehead-title">Admin</h2>
      <div class="rule"></div>
    </div>

    <div class="card">
      <h3>🗓️ Semaines</h3>
      <div id="semaine-active"></div>
      <div style="margin-top:14px;"><button class="ghost" id="btn-bloquer-semaine">Bloquer la semaine en cours maintenant</button></div>
      <div class="note-hint">Nouvelle semaine créée automatiquement chaque lundi (ou dès qu'un membre se connecte après). Bloquer maintenant force la clôture avant terme.</div>
      <table style="margin-top:16px;">
        <thead><tr><th>Semaine</th><th>Début</th><th>Fin</th><th>Statut</th></tr></thead>
        <tbody id="semaine-liste"></tbody>
      </table>
    </div>

    <div class="card">
      <h3>Taux & rémunération</h3>
      <div class="grid cols-3">
        <div class="field"><label>% par action mineure (épicerie, ATM, go fast)</label><input type="number" id="cfg-percent" min="0" max="100" step="1"></div>
        <div class="field"><label>$ par cambriolage</label><input type="number" id="cfg-gofast" min="0" step="1"></div>
        <div class="field"><label>$ par pochon vendu</label><input type="number" id="cfg-pochon" min="0" step="1"></div>
        <div class="field"><label>% frais de blanchiment</label><input type="number" id="cfg-blanchiment" min="0" max="100" step="1"></div>
        <div class="field"><label>$ par branche produite (labo, à venir)</label><input type="number" id="cfg-branche" min="0" step="1"></div>
      </div>
      <div style="margin-top:16px;"><button class="submit" id="cfg-save">Enregistrer</button></div>
    </div>

    <div class="card">
      <h3>Équipage</h3>
      <form class="entry" id="form-member">
        <div class="field"><label>Pseudo</label><input type="text" id="m-name" placeholder="Pseudo" required></div>
        <div class="field"><label>Mot de passe</label><input type="text" id="m-pass" placeholder="Mot de passe" required></div>
        <div class="field"><label>Grade</label><select id="m-grade"></select></div>
        <button class="submit" type="submit">Ajouter au crew</button>
      </form>
      <div id="member-list" style="margin-top:16px;"></div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
  const membre = initShell('admin', 'Admin');
  if (membre) {
    // ---- Semaines ----
    function renderSemaines() {
      Promise.all([
        db.ref('config/semaine_active_id').get(),
        db.ref('semaines').get()
      ]).then(([activeSnap, allSnap]) => {
        const activeId = activeSnap.val();
        const all = entries(allSnap.val()).sort((a, b) => (b[1].debut || '').localeCompare(a[1].debut || ''));

        const active = all.find(([id]) => id === activeId);
        document.getElementById('semaine-active').innerHTML = active
          ? `<div class="badge admin" style="font-size:14px;">🗓️ Semaine active : ${active[1].nom}</div>`
          : `<div class="empty">Aucune semaine active pour l'instant — elle sera créée automatiquement.</div>`;

        document.getElementById('semaine-liste').innerHTML = all.length === 0
          ? `<tr><td colspan="4" class="empty">Aucune semaine enregistrée.</td></tr>`
          : all.map(([id, w]) => `
              <tr>
                <td>${w.nom}${id === activeId ? ' <span class="badge admin">Active</span>' : ''}</td>
                <td>${w.debut ? new Date(w.debut).toLocaleDateString('fr-FR') : '—'}</td>
                <td>${w.fin ? new Date(w.fin).toLocaleDateString('fr-FR') : '—'}</td>
                <td>${w.bloquee ? '🔒 Bloquée' : '🟢 En cours'}</td>
              </tr>`).join('');
      });
    }
    renderSemaines();

    document.getElementById('btn-bloquer-semaine').addEventListener('click', async () => {
      const activeId = (await db.ref('config/semaine_active_id').get()).val();
      if (!activeId) { toast('Aucune semaine active.'); return; }
      await db.ref('semaines/' + activeId).update({ bloquee: true, closedAt: new Date().toISOString() });
      await ensureActiveWeek();
      toast('Semaine bloquée, nouvelle semaine créée.');
      renderSemaines();
    });

    // grades du formulaire
    document.getElementById('m-grade').innerHTML = GRADES_DEFAUT
      .map(g => `<option value="${g.id}">${g.emoji} ${g.nom}</option>`).join('');

    // ---- config (taux) ----
    db.ref('config').on('value', snap => {
      const cfg = Object.assign({ taux_action_pct: 25, taux_cambriolage: 700, taux_pochon: 25, blanchiment_taux: 20, taux_branche: 10 }, snap.val() || {});
      document.getElementById('cfg-percent').value = cfg.taux_action_pct;
      document.getElementById('cfg-gofast').value = cfg.taux_cambriolage;
      document.getElementById('cfg-pochon').value = cfg.taux_pochon;
      document.getElementById('cfg-blanchiment').value = cfg.blanchiment_taux;
      document.getElementById('cfg-branche').value = cfg.taux_branche;
    });

    document.getElementById('cfg-save').addEventListener('click', () => {
      const taux_action_pct = parseFloat(document.getElementById('cfg-percent').value);
      const taux_cambriolage = parseFloat(document.getElementById('cfg-gofast').value);
      const taux_pochon = parseFloat(document.getElementById('cfg-pochon').value);
      const blanchiment_taux = parseFloat(document.getElementById('cfg-blanchiment').value);
      const taux_branche = parseFloat(document.getElementById('cfg-branche').value);
      db.ref('config').update({
        ...(isNaN(taux_action_pct) ? {} : { taux_action_pct }),
        ...(isNaN(taux_cambriolage) ? {} : { taux_cambriolage }),
        ...(isNaN(taux_pochon) ? {} : { taux_pochon }),
        ...(isNaN(blanchiment_taux) ? {} : { blanchiment_taux }),
        ...(isNaN(taux_branche) ? {} : { taux_branche }),
      });
      toast('Taux enregistrés.');
    });

    // ---- membres ----
    document.getElementById('form-member').addEventListener('submit', e => {
      e.preventDefault();
      const prenom = document.getElementById('m-name').value.trim();
      const mot_de_passe = document.getElementById('m-pass').value;
      const grade = document.getElementById('m-grade').value;
      if (!prenom || !mot_de_passe) return;
      db.ref('membres/' + uid()).set({ prenom, mot_de_passe, grade, role: 'membre', actif: true });
      document.getElementById('m-name').value = '';
      document.getElementById('m-pass').value = '';
    });

    db.ref('membres').on('value', snap => {
      const list = entries(snap.val());
      const el = document.getElementById('member-list');
      if (list.length === 0) {
        el.innerHTML = '<div class="empty">Aucun membre pour le moment.</div>';
        return;
      }
      el.innerHTML = list.map(([id, m]) => {
        const g = gradeInfo(m.grade);
        return `<div class="member-row">
          <span class="member-name">${m.prenom} ${m.role === 'admin' ? '<span class="badge admin">Admin</span>' : ''}</span>
          <span style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <select class="grade-select" data-id="${id}">
              ${GRADES_DEFAUT.map(gr => `<option value="${gr.id}" ${gr.id === m.grade ? 'selected' : ''}>${gr.emoji} ${gr.nom}</option>`).join('')}
            </select>
            <label style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);">
              <input type="checkbox" class="admin-toggle" data-id="${id}" ${m.role === 'admin' ? 'checked' : ''}> Admin
            </label>
            <button class="del" data-id="${id}" data-type="membres">✕</button>
          </span>
        </div>`;
      }).join('');

      el.querySelectorAll('.grade-select').forEach(sel => {
        sel.addEventListener('change', () => db.ref('membres/' + sel.dataset.id).update({ grade: sel.value }));
      });
      el.querySelectorAll('.admin-toggle').forEach(chk => {
        chk.addEventListener('change', () => db.ref('membres/' + chk.dataset.id).update({ role: chk.checked ? 'admin' : 'membre' }));
      });
    });

    document.body.addEventListener('click', e => {
      if (e.target.classList.contains('del') && e.target.dataset.type === 'membres') {
        if (e.target.dataset.id === membre.id) { toast("Tu ne peux pas te supprimer toi-même."); return; }
        db.ref('membres/' + e.target.dataset.id).remove();
      }
    });
  }
</script>
</body>
</html>
