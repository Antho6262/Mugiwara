async function logAudit(action, details) {
  try {
    await db.ref("audit/" + uid()).set({
      action, details: details || "", membre: (SESSION && SESSION.prenom) || "?", createdAt: Date.now(),
    });
  } catch (e) { console.error("logAudit KO", e); }
}

async function envoyerWebhookEmbed(webhook, embed) {
  if (!webhook) return;
  try {
    await fetch(webhook, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ embeds: [{ footer: { text: "THE ROOLIO FAMILY" }, timestamp: new Date().toISOString(), ...embed }] }),
    });
  } catch (e) { console.error("webhook KO", e.message); }
}

/* ---------- Bannière image du résumé de semaine (même style que le bot Discord) ---------- */
let _policesBanniereChargees = false;
function chargerPolicesBanniere() {
  if (_policesBanniereChargees) return Promise.resolve();
  return new Promise((resolve) => {
    let link = document.getElementById("volta-banner-fonts");
    if (!link) {
      link = document.createElement("link");
      link.id = "volta-banner-fonts";
      link.rel = "stylesheet";
      link.href = "https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;600;700;800&display=swap";
      document.head.appendChild(link);
    }
    const finir = () => {
      Promise.all([
        document.fonts.load("58px Anton"),
        document.fonts.load("400 16px Poppins"),
        document.fonts.load("600 16px Poppins"),
        document.fonts.load("700 16px Poppins"),
        document.fonts.load("800 16px Poppins"),
      ]).then(() => { _policesBanniereChargees = true; resolve(); }).catch(() => resolve());
    };
    if (link.sheet) finir(); else link.onload = finir;
    setTimeout(finir, 2500); // filet de sécurité si onload ne se déclenche pas
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function roundRectTop(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x, y + h);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h);
  ctx.closePath();
}
function shadeColor(hex, percent) {
  const num = parseInt(hex.replace("#", ""), 16);
  let r = (num >> 16) + percent, g = ((num >> 8) & 0x00ff) + percent, b = (num & 0x0000ff) + percent;
  r = Math.min(255, Math.max(0, r)); g = Math.min(255, Math.max(0, g)); b = Math.min(255, Math.max(0, b));
  return `rgb(${r},${g},${b})`;
}

async function genererBanniereResumeWeb(resume, nomSemaine) {
  await chargerPolicesBanniere();
  const W = 1100, H = 2600;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, "#1a0506"); bgGrad.addColorStop(0.5, "#0d0203"); bgGrad.addColorStop(1, "#000000");
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

  ctx.save(); ctx.globalAlpha = 0.04; ctx.strokeStyle = "#ffffff";
  for (let i = -H; i < W; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + H, H); ctx.stroke(); }
  ctx.restore();

  ctx.textAlign = "center";
  ctx.fillStyle = "#8b1518"; ctx.font = "24px Poppins"; ctx.fillText("R O O L I O", W / 2, 70);
  ctx.fillStyle = "#ffffff"; ctx.font = "58px Anton"; ctx.fillText("RÉSUMÉ DE LA SEMAINE", W / 2, 135);
  ctx.fillStyle = "#a8a8a8"; ctx.font = "26px Poppins"; ctx.fillText(nomSemaine, W / 2, 172);

  const gradLine = ctx.createLinearGradient(80, 0, W - 80, 0);
  gradLine.addColorStop(0, "rgba(196,30,34,0)"); gradLine.addColorStop(0.5, "#c41e22"); gradLine.addColorStop(1, "rgba(196,30,34,0)");
  ctx.strokeStyle = gradLine; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(80, 195); ctx.lineTo(W - 80, 195); ctx.stroke();

  const totalGains = resume.gainsSale + resume.gainsPropre;
  const gy = 225, gh = 150;
  const gainGrad = ctx.createLinearGradient(0, gy, 0, gy + gh);
  gainGrad.addColorStop(0, "#3a0708"); gainGrad.addColorStop(1, "#1a0304");
  ctx.fillStyle = gainGrad; roundRect(ctx, 60, gy, W - 120, gh, 18); ctx.fill();
  ctx.strokeStyle = "#c41e22"; ctx.lineWidth = 1.5; roundRect(ctx, 60, gy, W - 120, gh, 18); ctx.stroke();
  ctx.fillStyle = "#e0a0a0"; ctx.font = "600 22px Poppins"; ctx.fillText("GAIN TOTAL DE LA SEMAINE", W / 2, gy + 45);
  ctx.fillStyle = "#ffffff"; ctx.font = "64px Anton"; ctx.fillText(formatMoney(totalGains), W / 2, gy + 115);

  const sy = gy + gh + 30, sh = 90;
  const cols = [
    { label: "ACTIONS", value: `${resume.nbActions}`, sub: `${resume.reussites} réussies · ${resume.echecs} échouées` },
    { label: "GAINS SALE", value: formatMoney(resume.gainsSale), sub: "argent non blanchi" },
    { label: "GAINS PROPRE", value: formatMoney(resume.gainsPropre), sub: "argent blanchi" },
  ];
  const colW = (W - 120 - 2 * 20) / 3;
  cols.forEach((c, i) => {
    const cx = 60 + i * (colW + 20);
    ctx.fillStyle = "#140506"; roundRect(ctx, cx, sy, colW, sh, 14); ctx.fill();
    ctx.strokeStyle = "rgba(196,30,34,0.4)"; ctx.lineWidth = 1; roundRect(ctx, cx, sy, colW, sh, 14); ctx.stroke();
    ctx.fillStyle = "#8b8b8b"; ctx.font = "600 16px Poppins"; ctx.fillText(c.label, cx + colW / 2, sy + 28);
    ctx.fillStyle = "#ffffff"; ctx.font = "800 26px Poppins"; ctx.fillText(c.value, cx + colW / 2, sy + 58);
    ctx.fillStyle = "#6b6b6b"; ctx.font = "13px Poppins"; ctx.fillText(c.sub, cx + colW / 2, sy + 78);
  });

  let py = sy + sh + 55;
  ctx.fillStyle = "#ffffff"; ctx.font = "34px Anton"; ctx.fillText("PODIUM", W / 2, py);

  const podium = resume.classementArr.slice(0, 3);
  const medailleColors = ["#ffd54a", "#d9d9d9", "#c98a4b"];
  const barHeights = [130, 100, 78];
  const order = [1, 0, 2];
  const podiumW = 260, gap = 24;
  const totalPodiumW = podiumW * 3 + gap * 2;
  const startX = (W - totalPodiumW) / 2;
  const contentTop = py + 90;
  const barTopMax = contentTop + 130;
  const podiumBaseY = barTopMax + barHeights[0];

  order.forEach((rankIdx) => {
    const m = podium[rankIdx];
    if (!m) return;
    const visualPos = order.indexOf(rankIdx);
    const bx = startX + visualPos * (podiumW + gap);
    const bh = barHeights[rankIdx];
    const by = podiumBaseY - bh;

    ctx.fillStyle = "#ffffff"; ctx.font = "700 22px Poppins"; ctx.fillText(m.prenom, bx + podiumW / 2, by - 45);
    ctx.fillStyle = "#a8a8a8"; ctx.font = "16px Poppins"; ctx.fillText(`${m.n} action(s)`, bx + podiumW / 2, by - 22);

    ctx.beginPath(); ctx.arc(bx + podiumW / 2, by - 95, 24, 0, Math.PI * 2);
    ctx.fillStyle = medailleColors[rankIdx]; ctx.fill();
    ctx.fillStyle = "#1a0506"; ctx.font = "800 22px Poppins"; ctx.fillText(`${rankIdx + 1}`, bx + podiumW / 2, by - 87);

    const barGrad = ctx.createLinearGradient(0, by, 0, by + bh);
    barGrad.addColorStop(0, medailleColors[rankIdx]); barGrad.addColorStop(1, shadeColor(medailleColors[rankIdx], -40));
    ctx.fillStyle = barGrad; roundRectTop(ctx, bx, by, podiumW, bh, 10); ctx.fill();
  });

  py = podiumBaseY + 45;

  const reste = resume.classementArr.slice(3, 9);
  if (reste.length) {
    ctx.textAlign = "left";
    ctx.fillStyle = "#8b8b8b"; ctx.font = "600 18px Poppins"; ctx.fillText("CLASSEMENT", 70, py);
    reste.forEach((m, i) => {
      const ry = py + 38 + i * 34;
      ctx.fillStyle = "#c9c9c9"; ctx.font = "600 17px Poppins"; ctx.fillText(`${i + 4}.`, 70, ry);
      ctx.fillStyle = "#ffffff"; ctx.font = "17px Poppins"; ctx.fillText(m.prenom, 105, ry);
      ctx.textAlign = "right"; ctx.fillStyle = "#8b8b8b"; ctx.fillText(`${m.n} action(s)`, W - 70, ry);
      ctx.textAlign = "left";
    });
    py += 38 + reste.length * 34 + 25;
  }

  if (resume.totalVendu > 0) {
    ctx.textAlign = "center";
    ctx.strokeStyle = gradLine;
    ctx.beginPath(); ctx.moveTo(80, py); ctx.lineTo(W - 80, py); ctx.stroke();
    py += 40;
    ctx.fillStyle = "#ffffff"; ctx.font = "26px Anton";
    ctx.fillText(`VENTES — ${resume.totalVendu} au total (${formatMoney(resume.gainsVentes)})`, W / 2, py);
    py += 40;
    ctx.textAlign = "left";
    resume.detailVentesArr.forEach((v, i) => {
      const ry = py + i * 30;
      ctx.fillStyle = "#c9c9c9"; ctx.font = "600 16px Poppins"; ctx.fillText(v.produit, 90, ry);
      ctx.textAlign = "right"; ctx.fillStyle = "#e0a0a0"; ctx.fillText(`${v.qte}`, W - 90, ry);
      ctx.textAlign = "left";
    });
    py += resume.detailVentesArr.length * 30 + 15;
  }

  if (resume.detailVentesParMembreArr && resume.detailVentesParMembreArr.length) {
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffffff"; ctx.font = "26px Anton";
    ctx.fillText("QUI A VENDU QUOI", W / 2, py);
    py += 32;

    ctx.textAlign = "left";
    resume.detailVentesParMembreArr.forEach((m) => {
      ctx.fillStyle = "#ffffff"; ctx.font = "700 17px Poppins"; ctx.fillText(m.prenom, 90, py);
      ctx.fillStyle = "#a8a8a8"; ctx.font = "16px Poppins";
      const detail = m.produits.map(p => `${p.produit} : ${p.qte}`).join("   ·   ");
      ctx.fillText(detail, 90, py + 22);
      py += 52;
    });
    py += 5;
  }

  const footerY = py + 55;
  const finalH = footerY + 35;

  ctx.textAlign = "center"; ctx.fillStyle = "#5a5a5a"; ctx.font = "15px Poppins";
  ctx.fillText("THE ROOLIO FAMILY", W / 2, footerY);

  const SCALE = 2;
  const finalCanvas = document.createElement("canvas");
  finalCanvas.width = W * SCALE; finalCanvas.height = finalH * SCALE;
  const fctx = finalCanvas.getContext("2d");
  fctx.scale(SCALE, SCALE);
  fctx.drawImage(canvas, 0, 0, W, finalH, 0, 0, W, finalH);

  const vg = fctx.createRadialGradient(W / 2, finalH * 0.3, 100, W / 2, finalH * 0.3, W * 0.9);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.55)");
  fctx.fillStyle = vg; fctx.fillRect(0, 0, W, finalH);
  fctx.strokeStyle = "#c41e22"; fctx.lineWidth = 3; fctx.strokeRect(10, 10, W - 20, finalH - 20);

  return new Promise((resolve) => finalCanvas.toBlob((blob) => resolve(blob), "image/png"));
}

async function envoyerWebhookImage(webhook, blob, filename) {
  const form = new FormData();
  form.append("payload_json", JSON.stringify({ embeds: [{ color: 0xc41e22, image: { url: "attachment://" + filename } }] }));
  form.append("files[0]", blob, filename);
  await fetch(webhook, { method: "POST", body: form });
}

/* Dates ancrées Europe/Paris (identique à la logique du bot Discord). */
function getParisParts(ts) {
  const fmt = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
  });
  const parts = fmt.formatToParts(new Date(ts));
  const get = (t) => Number(parts.find((p) => p.type === t).value);
  return { year: get("year"), month: get("month"), day: get("day"), hour: get("hour") === 24 ? 0 : get("hour"), minute: get("minute"), second: get("second") };
}
function ajouterJoursCivils(y, m, d, jours) {
  const anchor = new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
  anchor.setUTCDate(anchor.getUTCDate() + jours);
  return { year: anchor.getUTCFullYear(), month: anchor.getUTCMonth() + 1, day: anchor.getUTCDate() };
}
function parisWallToUTC(y, m, d, h, mi, s) {
  let guess = Date.UTC(y, m - 1, d, h, mi, s || 0);
  for (let i = 0; i < 2; i++) {
    const p = getParisParts(guess);
    const guessAsIfLocal = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
    guess += Date.UTC(y, m - 1, d, h, mi, s || 0) - guessAsIfLocal;
  }
  return guess;
}
function fmtJJMM(ts) {
  const p = getParisParts(ts);
  return String(p.day).padStart(2, "0") + "/" + String(p.month).padStart(2, "0");
}
function nomAutoSemaine(debut, fin) { return "Semaine du " + fmtJJMM(debut) + " au " + fmtJJMM(fin); }
function prochainesBornes(derniere) {
  if (!derniere || !derniere.fin) {
    // Pas de semaine précédente : ancre sur "maintenant" (dimanche 19h le plus récent).
    const now = Date.now();
    const p = getParisParts(now);
    const wd = new Intl.DateTimeFormat("en-US", { timeZone: "Europe/Paris", weekday: "short" }).format(new Date(now));
    const weekday = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[wd];
    let dimRef = ajouterJoursCivils(p.year, p.month, p.day, -weekday);
    let debut = parisWallToUTC(dimRef.year, dimRef.month, dimRef.day, 19, 0, 0);
    if (debut > now) { dimRef = ajouterJoursCivils(dimRef.year, dimRef.month, dimRef.day, -7); debut = parisWallToUTC(dimRef.year, dimRef.month, dimRef.day, 19, 0, 0); }
    const dimSuivant = ajouterJoursCivils(dimRef.year, dimRef.month, dimRef.day, 7);
    const fin = parisWallToUTC(dimSuivant.year, dimSuivant.month, dimSuivant.day, 19, 0, 0);
    return { debut, fin, verrouAt: fin };
  }
  const debut = derniere.fin;
  const p = getParisParts(debut);
  const dimSuivant = ajouterJoursCivils(p.year, p.month, p.day, 7);
  const fin = parisWallToUTC(dimSuivant.year, dimSuivant.month, dimSuivant.day, 19, 0, 0);
  return { debut, fin, verrouAt: fin };
}
/* Ouvre la semaine suivante après un blocage manuel, avec protection anti-doublon
   (même mécanisme d'index que le bot Discord). */
async function creerSemaineSuivante(derniere) {
  const bounds = prochainesBornes(derniere);
  const idxRef = db.ref("semaine_index/" + bounds.debut);
  const existe = await idxRef.once("value");
  if (existe.exists()) { console.log("Semaine suivante déjà créée par ailleurs."); return; }
  const id = uid();
  const nom = nomAutoSemaine(bounds.debut, bounds.fin);
  await idxRef.set(id);
  await db.ref("semaines/" + id).set({ nom, bloquee: false, createdAt: Date.now(), debut: bounds.debut, fin: bounds.fin, verrouAt: bounds.verrouAt });
}
/* Stats/badges optionnels : best-effort, ne doit jamais faire planter le blocage de semaine. */
async function majStatsEtBadges(weekId) {
  try {
    const snap = await db.ref("actions/" + weekId).once("value");
    const actions = entries(snap.val()).map(([, a]) => a).filter((a) => a.resultat === "Réussite");
    if (!actions.length) return;
    const parMembre = {};
    actions.forEach((a) => {
      if (!parMembre[a.membre_id]) parMembre[a.membre_id] = 0;
      parMembre[a.membre_id] += Number(a.quantite || 1);
    });
    for (const [membreId, count] of Object.entries(parMembre)) {
      const statsSnap = await db.ref("stats_membres/" + membreId).once("value");
      const stats = statsSnap.val() || { total_actions: 0 };
      stats.total_actions = (stats.total_actions || 0) + count;
      await db.ref("stats_membres/" + membreId).set(stats);
    }
  } catch (e) { console.error("majStatsEtBadges KO", e); }
}

function renderContent() {
  document.getElementById("content").innerHTML = `
    <h1>Admin</h1>
    <div class="sigil-rule"></div>
    <div class="tabs" id="tabsBar"></div>
    <div id="tabBody"></div>
  `;
  document.getElementById("tabsBar").innerHTML = TABS.map(t =>
    `<div class="tab${t === currentTab ? ' active' : ''}" onclick="switchTab('${t}')">${TAB_LABELS[t] || (t.charAt(0).toUpperCase() + t.slice(1))}</div>`
  ).join("");
  loadTab(currentTab);
}
function switchTab(t) { currentTab = t; renderContent(); }

async function loadTab(t) {
  const body = document.getElementById("tabBody");
  body.innerHTML = '<p class="muted">Chargement…</p>';
  if (t === "semaines") return tabSemaines(body);
  if (t === "membres") return tabMembres(body);
  if (t === "stock") return tabStock(body);
  if (t === "actions") return tabActions(body);
  if (t === "quotas") return tabQuotas(body);
  if (t === "grades") return tabGrades(body);
  if (t === "visibilite") return tabVisibilite(body);
  if (t === "permissions") return tabPermissions(body);
  if (t === "config") return tabConfig(body);
  if (t === "audit") return tabAudit(body);
}

/* ===================== SEMAINES ===================== */
let SEMAINES_LISTENER_ACTIF = false;

function renderTabSemaines(body, list) {
  body.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>Nouvelle semaine</h2></div>
      <div class="row"><input type="text" id="newSemaineNom" placeholder="Nom (ex: Semaine 2)">
      <button class="btn btn-primary" onclick="creerSemaine()">Créer</button></div>
      <p class="small muted mt8">La semaine créée s'enchaîne automatiquement après la dernière semaine existante (7 jours, verrouillage le dimanche à 19h00). Laisse le nom vide pour un nom automatique.</p>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Semaines</h2></div>
      <table><thead><tr><th>Nom</th><th>Statut</th><th>Créée le</th><th>Verrouillage auto</th><th></th></tr></thead>
        <tbody>${list.length ? list.map(s => `
          <tr><td>${s.nom}</td><td><span class="badge ${s.bloquee ? 'badge-fail' : 'badge-ok'}">${s.bloquee ? 'Bloquée' : 'Actif'}</span></td>
          <td class="small muted">${s.createdAt ? new Date(s.createdAt).toLocaleString('fr-FR') : '-'}</td>
          <td class="small muted">${s.verrouAt ? new Date(s.verrouAt).toLocaleString('fr-FR') : '—'}</td>
          <td>
            ${s.bloquee ? `<span class="btn btn-sm" onclick="toggleSemaine('${s.id}', false)">Débloquer</span>`
                        : `<span class="btn btn-sm btn-gold" onclick="bloquerSemaine('${s.id}','${s.nom}')">Bloquer + Résumé</span>`}
            <span class="btn btn-sm btn-danger" onclick="suppSemaine('${s.id}')">Suppr.</span>
          </td></tr>
        `).join("") : '<tr class="empty-row"><td colspan="5">Aucune semaine</td></tr>'}</tbody></table>
    </div>
    <div class="panel" id="resumeWrap" style="display:none;">
      <div class="panel-head"><h2>Résumé de semaine</h2></div>
      <textarea id="resumeText" rows="10" readonly></textarea>
      <p class="small muted mt8">Copie ce texte dans Discord, ou configure un webhook dans Admin → Config pour l'envoi automatique.</p>
    </div>
  `;
}

async function tabSemaines(body) {
  if (SEMAINES_LISTENER_ACTIF) {
    // Le listener tourne déjà (onglet quitté puis revisité) : un simple re-rendu
    // avec les dernières données connues suffit, pas besoin de se ré-abonner.
    const snap = await db.ref("semaines").once("value");
    const list = entries(snap.val()).map(([id, s]) => ({ id, ...s })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    renderTabSemaines(body, list);
    return;
  }
  SEMAINES_LISTENER_ACTIF = true;
  db.ref("semaines").on("value", (snap) => {
    if (currentTab !== "semaines") return; // évite de peindre un onglet qui n'est plus affiché
    const list = entries(snap.val()).map(([id, s]) => ({ id, ...s })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    renderTabSemaines(document.getElementById("tabBody"), list);
  });
}
/* Crée la prochaine semaine, enchaînée après la dernière semaine existante
   (peu importe si celle-ci est bloquée ou non). Évite les doublons de créneau
   qui provoquaient un verrouillage instantané. */
async function creerSemaine() {
  const saisie = document.getElementById("newSemaineNom").value.trim();
  const snap = await db.ref("semaines").once("value");
  const list = entries(snap.val()).map(([id, s]) => ({ id, ...s })).sort((a, b) => (b.debut || 0) - (a.debut || 0));
  const derniere = list[0] || null;
  const bounds = prochainesBornes(derniere);

  const idxRef = db.ref("semaine_index/" + bounds.debut);
  const existeSnap = await idxRef.once("value");
  if (existeSnap.exists()) {
    toast("Cette semaine existe déjà.", true);
    loadTab("semaines");
    return;
  }

  const nom = saisie || nomAutoSemaine(bounds.debut, bounds.fin);
  const id = uid();

/* Blocage manuel : verrouille la semaine, affiche le résumé, ET ouvre
   automatiquement la semaine suivante (même comportement que le
   verrouillage automatique de 19h00). */
async function bloquerSemaine(id, nom) {
  const snap = await db.ref("actions/" + id).once("value");
  const actions = entries(snap.val()).map(([aid, a]) => a);
  const gainsSale = actions.reduce((acc, a) => acc + Number(a.argent_sale || 0), 0);
  const gainsPropre = actions.reduce((acc, a) => acc + Number(a.argent_propre || 0), 0);
  const reussites = actions.filter(a => a.resultat === "Réussite").length;
  const echecs = actions.filter(a => a.resultat === "Échec").length;
  const parMembre = {};
  actions.forEach(a => { parMembre[a.prenom_membre] = (parMembre[a.prenom_membre] || 0) + 1; });
  const classement = Object.entries(parMembre).sort((a, b) => b[1] - a[1])
    .map(([p, n], i) => `${i + 1}. ${p} — ${n} action(s)`).join("\n");

  const ventes = actions.filter(a => a.produit_drogue && a.resultat === "Réussite");
  const parProduit = {};
  ventes.forEach(a => { parProduit[a.produit_drogue] = (parProduit[a.produit_drogue] || 0) + Number(a.quantite || 0); });
  const totalVendu = Object.values(parProduit).reduce((acc, n) => acc + n, 0);
  const gainsVentes = ventes.reduce((acc, a) => acc + Number(a.gains_totaux || 0), 0);
  const detailVentes = Object.entries(parProduit).sort((a, b) => b[1] - a[1])
    .map(([produit, qte]) => `${produit} : ${qte}`).join("\n");

  const parMembreVentes = {};
  ventes.forEach(a => {
    if (!parMembreVentes[a.prenom_membre]) parMembreVentes[a.prenom_membre] = {};
    parMembreVentes[a.prenom_membre][a.produit_drogue] = (parMembreVentes[a.prenom_membre][a.produit_drogue] || 0) + Number(a.quantite || 0);
  });
  const detailVentesParMembre = Object.entries(parMembreVentes)
    .sort((a, b) => Object.values(b[1]).reduce((s, n) => s + n, 0) - Object.values(a[1]).reduce((s, n) => s + n, 0))
    .map(([prenom, produits]) => `${prenom} — ${Object.entries(produits).map(([p, q]) => `${p} : ${q}`).join(", ")}`)
    .join("\n");

  const texte = `📋 RÉSUMÉ — ${nom} — The Roolio Family\n` +
    `Actions : ${actions.length} (✅ ${reussites} / ❌ ${echecs})\n` +
    `Gains sale : ${formatMoney(gainsSale)}\n` +
    `Gains propre : ${formatMoney(gainsPropre)}\n` +
    (totalVendu > 0 ? `\nVentes (${totalVendu} au total — ${formatMoney(gainsVentes)}) :\n${detailVentes}\n\nQui a vendu quoi :\n${detailVentesParMembre}\n` : "") +
    `\nClassement :\n${classement || "—"}`;

  await db.ref("semaines/" + id).update({ bloquee: true, closedAt: Date.now(), resume: texte });
  document.getElementById("resumeWrap").style.display = "block";
  document.getElementById("resumeText").value = texte;

  const cfgSnap = await db.ref("config/discord_webhook_semaine").once("value");
  const webhook = cfgSnap.val();
  if (webhook) {
    const classementArr = Object.entries(parMembre).sort((a, b) => b[1] - a[1]).map(([prenom, n]) => ({ prenom, n }));
    const detailVentesArr = Object.entries(parProduit).sort((a, b) => b[1] - a[1]).map(([produit, qte]) => ({ produit, qte }));
    const detailVentesParMembreArr = Object.entries(parMembreVentes)
      .sort((a, b) => Object.values(b[1]).reduce((s, n) => s + n, 0) - Object.values(a[1]).reduce((s, n) => s + n, 0))
      .map(([prenom, produits]) => ({ prenom, produits: Object.entries(produits).map(([produit, qte]) => ({ produit, qte })) }));
    const resumeObj = { gainsSale, gainsPropre, reussites, echecs, nbActions: actions.length, classementArr, totalVendu, gainsVentes, detailVentesArr, detailVentesParMembreArr };

    try {
      const blob = await genererBanniereResumeWeb(resumeObj, nom);
      await envoyerWebhookImage(webhook, blob, "resume.png");
    } catch (e) {
      console.error("Échec génération bannière (repli texte) :", e);
      const fields = [
        { name: "Actions", value: `${actions.length} (✅ ${reussites} / ❌ ${echecs})`, inline: true },
        { name: "Gains sale", value: formatMoney(gainsSale), inline: true },
        { name: "Gains propre", value: formatMoney(gainsPropre), inline: true },
      ];
      if (totalVendu > 0) {
        fields.push({ name: `Ventes (${totalVendu} au total — ${formatMoney(gainsVentes)})`, value: detailVentes || "—" });
        fields.push({ name: "Qui a vendu quoi", value: detailVentesParMembre || "—" });
      }
      fields.push({ name: "Classement", value: classement || "—" });
      await envoyerWebhookEmbed(webhook, {
        title: `📋 RÉSUMÉ — ${nom}`,
        color: VOLTA_COLOR_STEEL,
        thumbnail: { url: VOLTA_LOGO_URL },
        fields,
      });
    }
    toast("Résumé envoyé sur Discord.");
  }

  // Ouvre immédiatement la semaine suivante (7 jours après le verrouillage prévu de celle-ci).
  await majStatsEtBadges(id);
  logAudit("Semaine bloquée", nom);
  const semSnap = await db.ref("semaines/" + id).once("value");
  const semaineBloquee = { id, ...semSnap.val() };
  await creerSemaineSuivante(semaineBloquee);

  loadTab("semaines");
  document.getElementById("resumeWrap").style.display = "block";
  document.getElementById("resumeText").value = texte;
}

          <input type="checkbox" id="aProduction" style="width:auto;"> Cette action <b>ajoute</b> du stock au lieu d'en retirer (récolte/production, ex: Récolte de Champignons — au lieu d'une vente)
        </label>
      </div>
      <p class="small muted mt8">Soit une recette fixe (toujours le même produit, ex: ATM → Boîtier de piratage), soit une catégorie « variable » où le membre choisit le produit exact en saisissant l'action (ex: Vente de Drogue → quelle drogue, ou Récolte de Champignons → quel champignon).</p>

    </div>
    <div class="panel">
      <div class="panel-head"><h2>Actions disponibles</h2></div>
      <table><thead><tr><th>Nom</th><th>$ sale/u</th><th>$ propre/u</th><th>Stock</th><th></th></tr></thead>
        <tbody>${actions.length ? actions.map(a => {
          const catVar = a.cat_variable ? cats.find(c => c.id === a.cat_variable) : null;
          const recetteTxt = (a.recipe || []).map(r => {
            const cat = cats.find(c => c.id === r.catId);
            const prod = cat && cat.produits ? cat.produits[r.prodId] : null;
            return prod ? `${prod.nom} x${r.qty}` : "—";
          }).join(", ");
          return `<tr><td>${a.nom}</td><td>${formatMoney(a.montant_sale || 0)}</td><td>${formatMoney(a.montant_propre || 0)}</td>
          <td class="small">${catVar ? `Produit choisi (${catVar.emoji || ""} ${catVar.nom}) ${a.production ? '<span class="badge badge-ok">+ récolte</span>' : '<span class="badge">- vente</span>'}` : (recetteTxt || "—")}</td>
          <td><span class="btn btn-sm btn-danger" onclick="suppAction('${a.id}')">Suppr.</span></td></tr>`;
        }).join("") : '<tr class="empty-row"><td colspan="5">Aucune action définie</td></tr>'}</tbody></table>
    </div>
  `;
}

async function importerActionsClassiques() {
  if (!confirm("Importer les actions classiques (catégories de stock + 5 actions) ? Les éléments déjà existants avec le même nom ne seront pas dupliqués si tu annules après vérification.")) return;

  const cats = {
    drogue_cat: { nom: "Drogue", emoji: "💊", produits: {
      meth: { nom: "Meth", prix: 100, stock: 0, seuil: 5 },
      coke: { nom: "Coke", prix: 150, stock: 0, seuil: 5 },
      weed: { nom: "Weed", prix: 80, stock: 0, seuil: 5 }
    }},
    materiel_cat: { nom: "Matériel", emoji: "🛠️", produits: {
      boitier: { nom: "Boîtier de piratage", prix: 0, stock: 0, seuil: 2 },
      crochetage: { nom: "Outil de crochetage", prix: 0, stock: 0, seuil: 2 }
    }},
    plantation_cat: { nom: "Plantation", emoji: "🌱", produits: {
      eau: { nom: "Eau", prix: 0, stock: 0, seuil: 5 },
      fertilisant: { nom: "Fertilisant", prix: 0, stock: 0, seuil: 5 },
      graine: { nom: "Graine", prix: 0, stock: 0, seuil: 5 },
      pot: { nom: "Pot", prix: 0, stock: 0, seuil: 5 }
    }},
    branches_cat: { nom: "Branches", emoji: "🌿", produits: {
      branche: { nom: "Branche de cannabis", prix: 0, stock: 0, seuil: 5 }
    }}
  };
  for (const [catId, cat] of Object.entries(cats)) {
    await db.ref("stock/" + catId).update(cat);
  }

  await db.ref("actions_dispo").update({
    vente_drogue: { nom: "Vente de Drogue", montant_sale: 0, montant_propre: 0, recipe: [], cat_variable: "drogue_cat" },
    atm: { nom: "ATM", montant_sale: 0, montant_propre: 0, recipe: [{ catId: "materiel_cat", prodId: "boitier", qty: 1 }] },
    cambu: { nom: "Cambu", montant_sale: 0, montant_propre: 0, recipe: [{ catId: "materiel_cat", prodId: "crochetage", qty: 1 }] },
    plantation: { nom: "Plantation", montant_sale: 0, montant_propre: 0, recipe: [
      { catId: "plantation_cat", prodId: "eau", qty: 1 }, { catId: "plantation_cat", prodId: "fertilisant", qty: 1 },
      { catId: "plantation_cat", prodId: "graine", qty: 1 }, { catId: "plantation_cat", prodId: "pot", qty: 1 }
    ]},
    vente_branches: { nom: "Vente de Branches", montant_sale: 0, montant_propre: 0, recipe: [{ catId: "branches_cat", prodId: "branche", qty: 1 }] }
  });

  toast("Actions importées — ajuste les prix/stocks dans Admin → Stock.");
  loadTab("actions");
}
let RECIPE_LINES = [];
function addRecipeLine() {
  const val = document.getElementById("recipeProd").value;
  const qty = Number(document.getElementById("recipeQty").value) || 0;
  if (!val || qty <= 0) { toast("Sélectionne un produit et une quantité.", true); return; }
  const [catId, prodId] = val.split("::");
  RECIPE_LINES.push({ catId, prodId, qty });
  document.getElementById("recipeLines").textContent = "Recette : " + RECIPE_LINES.length + " ligne(s) ajoutée(s) — sera enregistrée à la création.";
}
async function creerAction() {
  const nom = document.getElementById("aNom").value.trim();
  if (!nom) { toast("Nom requis.", true); return; }
  await db.ref("actions_dispo/" + uid()).set({
    nom, montant_sale: Number(document.getElementById("aSale").value) || 0,
    montant_propre: Number(document.getElementById("aPropre").value) || 0,
    recipe: RECIPE_LINES,
    cat_variable: document.getElementById("aCatVariable").value || null,
    production: document.getElementById("aProduction").checked
  });
  RECIPE_LINES = [];
  logAudit("Action créée", nom);
  toast("Action créée.");
  loadTab("actions");
}
async function suppAction(id) { if (confirm("Supprimer cette action ?")) { await db.ref("actions_dispo/" + id).remove(); logAudit("Action supprimée", id); loadTab("actions"); } }

/* ===================== QUOTAS ===================== */
async function getActiveWeekAdmin() {
  const snap = await db.ref("semaines").once("value");
  const list = entries(snap.val()).map(([id, s]) => ({ id, ...s }));
  list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  return list.find(s => s.bloquee !== true) || list[0] || null;
}
function barreAdmin(pct) {
  return `<div style="background:var(--bg-2); border-radius:6px; height:8px; overflow:hidden; min-width:90px;">
    <div style="height:100%; width:${Math.min(100, pct)}%; background:${pct >= 100 ? 'var(--success)' : 'var(--steel)'};"></div></div>`;
}
async function tabQuotas(body) {
  const week = await getActiveWeekAdmin();
  const [snapM, snapAc, snapAcDispo, snapS, snapQC, snapG] = await Promise.all([
    db.ref("membres").once("value"),
    week ? db.ref("actions/" + week.id).once("value") : Promise.resolve({ val: () => null }),
    db.ref("actions_dispo").once("value"),
    db.ref("stock").once("value"),
    db.ref("quotas_categorie").once("value"),
    db.ref("visibilite_grades").once("value")
  ]);
  const visi = snapG.val() || {};
  const gradesMasques = new Set(Object.keys(visi).filter(g => visi[g] && visi[g].quotas === false));
  const membres = entries(snapM.val()).map(([id, m]) => ({ id, ...m })).filter(m => m.actif !== false && !gradesMasques.has(m.grade));
  const actions = entries(snapAc.val()).map(([id, a]) => a);
  const actionsDispo = snapAcDispo.val() || {};
  const stock = snapS.val() || {};
  const quotasCategorie = snapQC.val() || {};

  body.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>Quota global (nb d'actions / semaine)</h2></div>
      <table><thead><tr><th>Membre</th><th>Quota</th><th>Réalisé</th><th>Progression</th></tr></thead>
        <tbody>${membres.length ? membres.map(m => {
          const fait = actions.filter(a => a.membre_id === m.id && a.resultat === "Réussite" && !a.produit_drogue_id).reduce((acc, a) => acc + Number(a.quantite || 0), 0);
          const quota = Number(m.quota) || 0;
          const pct = quota > 0 ? Math.round(fait / quota * 100) : 0;
          return `<tr><td>${m.prenom} ${m.nom || ""}</td>
            <td><input type="number" value="${quota}" style="max-width:90px" onchange="majQuotaAdmin('${m.id}', this.value)"></td>
            <td>${fait}</td><td>${barreAdmin(pct)}</td></tr>`;
        }).join("") : '<tr class="empty-row"><td colspan="4">Aucun membre</td></tr>'}</tbody></table>
    </div>
    <div id="quotasProduitsAdminWrap"></div>
  `;

  // une seule cible par catégorie "produit variable" (ex: Drogue), peu importe le produit exact vendu
  const catIds = [...new Set(Object.values(actionsDispo).map(a => a.cat_variable).filter(Boolean))];
  const wrap = document.getElementById("quotasProduitsAdminWrap");
  if (!catIds.length) {
    wrap.innerHTML = '<div class="panel"><p class="muted small">Aucune action avec produit variable (ex: Vente de Drogue) n\'est configurée dans l\'onglet Actions.</p></div>';
    return;
  }
  wrap.innerHTML = catIds.map(catId => {
    const cat = stock[catId];
    if (!cat) return "";
    const produitIds = new Set(Object.keys(cat.produits || {}));
    return `<div class="panel">
      <div class="panel-head"><h2>${cat.emoji || ""} Quota global ${cat.nom} (toutes confondues)</h2></div>
      <table><thead><tr><th>Membre</th><th>Quota</th><th>Réalisé</th><th>Progression</th></tr></thead>
        <tbody>${membres.map(m => {
          const quota = Number((quotasCategorie[m.id] || {})[catId]) || 0;
          const fait = actions.filter(a => a.membre_id === m.id && produitIds.has(a.produit_drogue_id) && a.resultat === "Réussite")
            .reduce((acc, a) => acc + Number(a.quantite || 0), 0);
          const pct = quota > 0 ? Math.round(fait / quota * 100) : 0;
          return `<tr><td>${m.prenom}</td>
            <td><input type="number" value="${quota}" style="max-width:90px" onchange="majQuotaCategorieAdmin('${m.id}','${catId}', this.value)"></td>
            <td>${fait}</td><td>${barreAdmin(pct)}</td></tr>`;
        }).join("")}</tbody></table>
    </div>`;
  }).join("");
}
async function majQuotaAdmin(id, val) {
  await db.ref("membres/" + id + "/quota").set(Number(val) || 0);
  toast("Quota mis à jour.");
}
async function majQuotaCategorieAdmin(membreId, catId, val) {
  await db.ref(`quotas_categorie/${membreId}/${catId}`).set(Number(val) || 0);
  toast("Quota mis à jour.");
}

          <td>${e.taux || 0}%</td><td>${e.taux_actions || 0}%</td>
          <td><span class="btn btn-sm btn-danger" onclick="supprimerEvent('${e.id}')">Suppr.</span></td></tr>
        `).join("") : '<tr class="empty-row"><td colspan="6">Aucun event</td></tr>'}</tbody>
      </table>
    </div>
  `;
}
async function saveTauxGrades() {
  const grades = document.getElementById("_gradesListForConfig").textContent.split("||").filter(Boolean);
  const update = {};
  grades.forEach(g => {
    const d = document.getElementById("cfgGradeDrogue_" + g).value;
    const a = document.getElementById("cfgGradeAutres_" + g).value;
    update[g] = {};
    if (d !== "") update[g].drogue = Number(d);
    if (a !== "") update[g].autres = Number(a);
  });
  await db.ref("config/taux_paye_grades").set(update);
  logAudit("Taux de paye par grade modifiés");
  toast("Taux par grade enregistrés.");
}
async function creerEvent() {
  const debut = document.getElementById("evDebut").value;
  const fin = document.getElementById("evFin").value;
  const taux = Number(document.getElementById("evTauxDrogue").value) || 0;
  const taux_actions = Number(document.getElementById("evTauxActions").value) || 0;
  const nom = document.getElementById("evNom").value.trim();
  if (!debut || !fin) { toast("Remplis début et fin.", true); return; }
  if (new Date(fin) <= new Date(debut)) { toast("La fin doit être après le début.", true); return; }
  await db.ref("events_drogue/" + uid()).set({ debut: new Date(debut).getTime(), fin: new Date(fin).getTime(), taux, taux_actions, nom, createdAt: Date.now() });
  logAudit("Event créé", nom || "sans nom");
  toast("Event créé.");
  loadTab("config");
}
async function supprimerEvent(id) {
  await db.ref("events_drogue/" + id).remove();
  logAudit("Event supprimé", id);
  loadTab("config");
}
async function saveConfig() {
  await db.ref("config").update({
    blanchiment_taux: Number(document.getElementById("cfgTaux").value) || 35,
    taux_paye_drogue: Number(document.getElementById("cfgTauxPayeDrogue").value) || 0,
    taux_paye_autres: Number(document.getElementById("cfgTauxPayeAutres").value) || 0,
    discord_webhook_semaine: document.getElementById("cfgWebhook").value.trim(),
    discord_webhook_quota: document.getElementById("cfgWebhookQuota").value.trim()
  });
  logAudit("Config modifiée", "Paramètres généraux / webhooks");
  toast("Configuration enregistrée.");
}

/* ===================== AUDIT ===================== */
async function tabAudit(body) {
  const snap = await db.ref("audit").limitToLast(200).once("value");
  const list = entries(snap.val()).map(([id, a]) => ({ id, ...a })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  body.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>Journal d'audit — 200 dernières actions</h2></div>
      <p class="small muted">Trace qui a créé, modifié ou supprimé quoi (membres, semaines, stock, actions, config, permissions...). Les modifications de produits/quotas très fréquentes ne sont pas toutes détaillées pour rester lisible.</p>
      <table><thead><tr><th>Date</th><th>Membre</th><th>Action</th><th>Détail</th></tr></thead>
        <tbody>${list.length ? list.map(a => `
          <tr><td class="small muted" style="white-space:nowrap;">${a.createdAt ? new Date(a.createdAt).toLocaleString('fr-FR') : '-'}</td>
          <td>${a.membre || '?'}</td><td>${a.action}</td><td class="small muted">${a.details || ''}</td></tr>
        `).join("") : '<tr class="empty-row"><td colspan="4">Aucune entrée pour le moment.</td></tr>'}</tbody></table>
    </div>
  `;
}

(async function () {
  await authReady;
  SESSION = await initShell("admin", "Admin");
  if (!SESSION) return;
  renderContent();
})();
</script>
